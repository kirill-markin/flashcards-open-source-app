function render(){const item=catalog.find(item=>item.tag===language.value);device.querySelector('[value="ipad"]').disabled=!item.sets.some(set=>set.family==='ipad');if(device.value==='ipad'&&!item.sets.some(set=>set.family==='ipad'))device.value='iphone';const set=item.sets.find(set=>set.family===device.value);document.querySelector('#details').textContent=item.storeLocale?'App Store · '+item.storeLocale+' · '+(device.value==='iphone'?'iPhone':'iPad'):'Дополнительный язык приложения: у Apple нет отдельной локализации App Store.';document.querySelector('#overview').href=set.preview;const cards=document.querySelector('#cards');cards.replaceChildren();for(const file of set.files){const figure=document.createElement('figure');const link=document.createElement('a');link.href=file.path;link.target='_blank';const image=document.createElement('img');image.src=file.path;image.alt=file.heading+' — '+file.caption;link.append(image);figure.append(link);const caption=document.createElement('figcaption');caption.textContent=file.heading+' · '+file.caption;figure.append(caption);cards.append(figure)}}language.addEventListener('change',render);device.addEventListener('change',render);render();
