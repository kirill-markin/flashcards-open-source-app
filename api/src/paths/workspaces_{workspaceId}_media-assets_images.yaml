post:
  tags:
    - media-assets
  summary: Ingest and normalize an image media asset
  description: >-
    Accepts JPEG, PNG, or WebP image bytes, normalizes them to canonical JPEG
    media bytes, deduplicates by the final normalized SHA-256 digest, and
    creates or updates the workspace-scoped logical media asset. Backend storage
    keys and hashes remain implementation details of the returned media asset.
    The raw request body must be at most 4000000 bytes.
  security:
    - ApiKeyHeader: []
  parameters:
    - name: workspaceId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/WorkspaceIdString.yaml
    - name: x-media-asset-id
      in: header
      required: true
      schema:
        $ref: ../components/schemas/UuidString.yaml
    - name: x-media-source-url
      in: header
      required: false
      schema:
        type: string
        format: uri
    - name: x-media-created-at
      in: header
      required: true
      schema:
        type: string
        format: date-time
    - name: x-media-client-updated-at
      in: header
      required: true
      schema:
        type: string
        format: date-time
    - name: x-media-last-modified-by-replica-id
      in: header
      required: true
      schema:
        $ref: ../components/schemas/UuidString.yaml
    - name: x-media-last-operation-id
      in: header
      required: true
      schema:
        $ref: ../components/schemas/MediaAssetLastOperationId.yaml
  requestBody:
    required: true
    content:
      image/jpeg:
        schema:
          type: string
          format: binary
          maxLength: 4000000
      image/png:
        schema:
          type: string
          format: binary
          maxLength: 4000000
      image/webp:
        schema:
          type: string
          format: binary
          maxLength: 4000000
      application/octet-stream:
        schema:
          type: string
          format: binary
          maxLength: 4000000
  responses:
    '200':
      description: Image normalized and logical media asset upserted
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MediaAssetMutationResponse.yaml
    default:
      description: Authenticated request error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
