get:
  tags:
    - public-catalog
  summary: Create a public package media download URL
  description: >-
    Verifies that the package version is published and that the package-local
    media key belongs to that version, then returns a backend-controlled API URL
    for downloading the media bytes. The response never exposes private
    object-storage keys or signed object-storage URLs.
  parameters:
    - name: packageVersionId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UuidString.yaml
    - name: packageMediaKey
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
  responses:
    '200':
      description: Public package media backend download URL created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CatalogPublicPackageMediaDownloadUrlResponse.yaml
    default:
      description: Public catalog request error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PublicErrorEnvelope.yaml
