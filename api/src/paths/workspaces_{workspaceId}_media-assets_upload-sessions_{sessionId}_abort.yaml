post:
  tags:
    - media-assets
  summary: Abort a multipart media asset upload session
  description: >-
    Aborts the backend-controlled direct S3 multipart upload and marks the
    upload session aborted. No logical media asset is created by this call.
  security:
    - ApiKeyHeader: []
  parameters:
    - name: workspaceId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UuidString.yaml
    - name: sessionId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UuidString.yaml
  responses:
    '200':
      description: Upload session aborted
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MediaAssetUploadSessionAbortResponse.yaml
    default:
      description: Authenticated request error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
