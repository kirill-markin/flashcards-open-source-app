post:
  tags:
    - media-assets
  summary: Abort a multipart media asset upload session
  description: >-
    Aborts the backend-controlled direct S3 multipart upload and marks the
    upload session aborted. No logical media asset is created by this call. If
    completion has a live foreground writer, this call returns 503
    MEDIA_ASSET_UPLOAD_SESSION_COMPLETION_IN_PROGRESS; if completion is already
    pending in durable reconciliation, it returns 409 with the same code.
    Those code-specific responses leave the session, S3 upload, and writer
    unchanged. Other transient failures can occur after abort admission or
    storage work and do not guarantee rollback.
  security:
    - ApiKeyHeader: []
  parameters:
    - name: workspaceId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/WorkspaceIdString.yaml
    - name: sessionId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UuidString.yaml
  responses:
    '200':
      description: Upload session aborted
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MediaAssetUploadSessionAbortResponse.yaml
    '403':
      description: |-
        `WORKSPACE_ACCESS_DENIED` means workspace access changed during abort.
        It can be detected before S3 abort admission or after admitted S3 work
        during closure. Reload account and workspace access, session, and
        media-asset state before retrying; do not assume rollback.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
    '409':
      description: |-
        Abort conflict. Semantics depend on `error.code`:

        - `MEDIA_ASSET_UPLOAD_SESSION_COMPLETION_IN_PROGRESS`: completion is
          being durably reconciled, abort admission was denied, and no database
          or S3 mutation occurred. Wait for `Retry-After`, then retry completion
          or session creation instead of retrying abort immediately.
        - `MEDIA_ASSET_UPLOAD_SESSION_COMPLETED`: the session was found completed
          either during pre-S3 abort admission or during post-S3 state reload.
          Reload and use the completed media asset; do not retry abort or create
          a replacement upload. S3 abort work may or may not have run; do not
          assume rollback.
        - `MEDIA_ASSET_UPLOAD_SESSION_STATE_CONFLICT`: the conflict occurred
          either during pre-S3 abort admission or during post-S3 closure or
          state reload. Reload the session and media asset before choosing the
          next action; do not blindly retry abort. S3 abort work may or may not
          have run; do not assume rollback.
      headers:
        Retry-After:
          description: >-
            Seconds to wait for
            MEDIA_ASSET_UPLOAD_SESSION_COMPLETION_IN_PROGRESS. Completed and
            state-conflict variants may omit this header.
          schema:
            type: string
          example: '1'
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
          example:
            ok: false
            data: {}
            instructions: >-
              Completion is still in progress and abort made no changes. Wait
              for Retry-After, then retry completion or create-session to
              observe the reconciled asset.
            docs:
              openapiUrl: https://api.flashcards-open-source-app.com/v1/agent/openapi.json
              docsUrl: https://flashcards-open-source-app.com/docs/
            error:
              code: MEDIA_ASSET_UPLOAD_SESSION_COMPLETION_IN_PROGRESS
              message: Multipart completion is being durably reconciled.
    '404':
      description: |-
        `MEDIA_ASSET_UPLOAD_SESSION_NOT_FOUND` means the session identifier is
        wrong or stale. It can be detected before abort admission or during
        closure after admitted S3 work. Reload canonical upload-session and
        media-asset state, correct a wrong identifier, and stop retrying abort
        if the stale session no longer exists. Do not assume rollback.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
    '503':
      description: |-
        Transient abort failure. Semantics depend on `error.code`:

        - `MEDIA_ASSET_UPLOAD_SESSION_COMPLETION_IN_PROGRESS`: completion has a
          live foreground writer, abort admission was denied, and no database
          or S3 mutation occurred. Wait for `Retry-After`, then retry completion
          or session creation before attempting abort again.
        - `MEDIA_ASSET_STORAGE_UNAVAILABLE`: abort was admitted before storage
          failed, so the session may be `aborting` and the S3 outcome may be
          unknown. Retry the same abort request; do not assume rollback.
        - `MEDIA_BLOB_LIFECYCLE_BUSY`: S3 abort completed, but database closure
          is temporarily fenced and the session remains `aborting`. Wait for
          `Retry-After`, then retry the same abort request.
        - `SERVICE_UNAVAILABLE`: a database outcome may be unknown. Wait for
          `Retry-After`, retry the same abort request, and do not assume
          rollback.
      headers:
        Retry-After:
          description: >-
            Seconds to wait when the error variant supplies a retry delay.
            Guaranteed for completion-in-progress, lifecycle-busy, and
            service-unavailable responses.
          schema:
            type: string
          example: '1'
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
          example:
            ok: false
            data: {}
            instructions: >-
              Completion still has a live writer and abort made no changes.
              Wait for Retry-After, then retry completion or create-session to
              observe the asset outcome.
            docs:
              openapiUrl: https://api.flashcards-open-source-app.com/v1/agent/openapi.json
              docsUrl: https://flashcards-open-source-app.com/docs/
            error:
              code: MEDIA_ASSET_UPLOAD_SESSION_COMPLETION_IN_PROGRESS
              message: Multipart completion has a live foreground writer.
    '500':
      description: |-
        `DATABASE_COMMIT_OUTCOME_UNKNOWN` means an abort admission or closure
        commit response was lost and rollback is not guaranteed. Reload the
        upload session and media asset before retrying the same abort, and stop
        if canonical state is already terminal.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
    default:
      description: Authenticated request error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
