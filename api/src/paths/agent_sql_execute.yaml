post:
  tags:
    - sql
  summary: Run write published SQL against the selected workspace
  description: >-
    Executes write statements of the published Flashcards SQL dialect for the
    currently selected workspace. This is not full PostgreSQL. Supported
    statements are INSERT, UPDATE, and DELETE across published writable
    resources only. This endpoint rejects SHOW TABLES, DESCRIBE, SHOW COLUMNS,
    and SELECT; use POST /agent/sql/query for reads. Cards have no deck_id column
    and no deck membership: a deck is a saved tag filter whose tags column
    defines the filter, so the only association between a card and a deck is
    matching tags. Decks expose deck_id, name, tags, created_at, updated_at, and
    deleted_at, and have no description column. Multiple write statements may be
    separated with semicolons in one sql string and are executed atomically: all
    statements succeed or the whole batch fails. Send schema discovery to POST
    /agent/sql/query as its own request, and never in the same
    semicolon-separated sql string as statements that depend on the result,
    because the whole batch is composed before any statement runs. Bulk-write
    split arithmetic: at most 100 rows affected per statement, at most 50
    statements per batch, and a batch must not mix read and write statements.
    Split larger work across separate statements or separate requests. Array
    columns (e.g. tags) take a parenthesized list such as ('tag1', 'tag2'), or ()
    for empty. UPDATE and DELETE WHERE clauses support parenthesized AND/OR
    groups where AND binds tighter than OR, LIKE, NOT LIKE, ILIKE,
    case-insensitive exact string matches via LOWER(column) = 'value',
    LOWER(column) IN (...), and LOWER(column) NOT IN (...), the LOWER(column)
    LIKE, LOWER(column) NOT LIKE, and LOWER(column) ILIKE forms, array comparison
    against a literal tag list such as tags = ('english', 'slang') or tags = ()
    for rows with no tags, array-column intersection such as
    tags OVERLAP ('english', 'slang') for rows carrying at least one of the
    listed values, compared exactly and case-sensitively, so pass tag values as
    they are stored, MATCH('text') to keep rows where any column of the row contains
    that text as a case-insensitive substring (it scans every column, including
    tags and JSON metadata, and there is no tokenization, so prefer one word or an
    exact phrase). Filter by tag in UPDATE and DELETE with
    tags OVERLAP ('tag'), because UNNEST is only available in SELECT.
  security:
    - ApiKeyHeader: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AgentSqlRequest.yaml
        examples:
          insertCard:
            value:
              sql: >-
                INSERT INTO cards (front_text, back_text, tags) VALUES
                ('Question?', 'Answer', ('tag'))
          updateCard:
            value:
              sql: >-
                UPDATE cards SET back_text = 'Updated answer' WHERE card_id =
                '50b5b928-7f04-4cc8-878d-6cd0e8b98474'
          mutationBatch:
            value:
              sql: >-
                UPDATE cards SET back_text = 'First update' WHERE card_id =
                '50b5b928-7f04-4cc8-878d-6cd0e8b98474'; UPDATE cards SET
                back_text = 'Second update' WHERE card_id =
                '60b5b928-7f04-4cc8-878d-6cd0e8b98475'
  responses:
    '200':
      description: SQL write executed successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentSqlEnvelope.yaml
          examples:
            updateCard:
              value:
                ok: true
                data:
                  statementType: update
                  resource: cards
                  sql: >-
                    UPDATE cards SET back_text = 'Updated answer' WHERE card_id
                    = '50b5b928-7f04-4cc8-878d-6cd0e8b98474'
                  normalizedSql: >-
                    UPDATE cards SET back_text = 'Updated answer' WHERE card_id
                    = '50b5b928-7f04-4cc8-878d-6cd0e8b98474'
                  rows: []
                  affectedCount: 1
                instructions: >-
                  The mutation succeeded. Read data.affectedCount for the
                  summary. If you need the resulting rows, inspect data.rows or
                  run a follow-up SELECT query. This endpoint supports the
                  published SQL dialect, not full PostgreSQL. Use
                  docs.openapiUrl for the published external agent contract.
                docs:
                  openapiUrl: https://api.flashcards-open-source-app.com/v1/agent/openapi.json
                  docsUrl: https://flashcards-open-source-app.com/docs/
            mutationBatch:
              value:
                ok: true
                data:
                  statementType: batch
                  resource: null
                  sql: >-
                    UPDATE cards SET back_text = 'First update' WHERE card_id =
                    '50b5b928-7f04-4cc8-878d-6cd0e8b98474'; UPDATE cards SET
                    back_text = 'Second update' WHERE card_id =
                    '60b5b928-7f04-4cc8-878d-6cd0e8b98475'
                  normalizedSql: >-
                    UPDATE cards SET back_text = 'First update' WHERE card_id =
                    '50b5b928-7f04-4cc8-878d-6cd0e8b98474'; UPDATE cards SET
                    back_text = 'Second update' WHERE card_id =
                    '60b5b928-7f04-4cc8-878d-6cd0e8b98475'
                  statements:
                    - statementType: update
                      resource: cards
                      sql: >-
                        UPDATE cards SET back_text = 'First update' WHERE
                        card_id = '50b5b928-7f04-4cc8-878d-6cd0e8b98474'
                      normalizedSql: >-
                        UPDATE cards SET back_text = 'First update' WHERE
                        card_id = '50b5b928-7f04-4cc8-878d-6cd0e8b98474'
                      rows: []
                      affectedCount: 1
                    - statementType: update
                      resource: cards
                      sql: >-
                        UPDATE cards SET back_text = 'Second update' WHERE
                        card_id = '60b5b928-7f04-4cc8-878d-6cd0e8b98475'
                      normalizedSql: >-
                        UPDATE cards SET back_text = 'Second update' WHERE
                        card_id = '60b5b928-7f04-4cc8-878d-6cd0e8b98475'
                      rows: []
                      affectedCount: 1
                  statementCount: 2
                  affectedCountTotal: 2
                instructions: >-
                  The batch mutation succeeded. Read data.statements for
                  per-statement results and data.affectedCountTotal for the
                  summary. This endpoint supports the published SQL dialect,
                  not full PostgreSQL. Use docs.openapiUrl for the published
                  external agent contract.
                docs:
                  openapiUrl: https://api.flashcards-open-source-app.com/v1/agent/openapi.json
                  docsUrl: https://flashcards-open-source-app.com/docs/
    '503':
      description: Service temporarily unavailable
      headers:
        Retry-After:
          description: Seconds to wait before retrying the same SQL write request.
          schema:
            type: string
          example: '1'
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
          example:
            ok: false
            data: {}
            instructions: Wait for the Retry-After header before retrying the same request.
            docs:
              openapiUrl: https://api.flashcards-open-source-app.com/v1/agent/openapi.json
              docsUrl: https://flashcards-open-source-app.com/docs/
            error:
              code: SERVICE_UNAVAILABLE
              message: Service is temporarily unavailable. Retry shortly.
    default:
      description: Agent error envelope
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
