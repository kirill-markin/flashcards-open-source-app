post:
  tags:
    - media-assets
  summary: Complete a multipart media asset upload session
  description: >-
    Completes the backend-controlled direct S3 multipart upload after all parts
    have been uploaded to their presigned PUT URLs, validates the stored object
    metadata, and creates or idempotently updates the workspace logical media
    asset. If the request reaches its safe deadline after completion has been
    accepted, the backend hands the exact completion to durable reconciliation
    and returns a retryable 503. Keep the session and completed-parts payload,
    wait for Retry-After, and retry this same completion request; do not abort
    the session or create a replacement upload.
  security:
    - ApiKeyHeader: []
  parameters:
    - name: workspaceId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/WorkspaceIdString.yaml
    - name: sessionId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UuidString.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CompleteMediaAssetUploadSessionInput.yaml
  responses:
    '200':
      description: Media asset upload completed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MediaAssetMutationResponse.yaml
    '400':
      description: |-
        Invalid completion input. Semantics depend on `error.code`:

        - Part-validation errors, including `MEDIA_ASSET_PARTS_REQUIRED`,
          `MEDIA_ASSET_PART_COUNT_INVALID`, `MEDIA_ASSET_PART_NUMBER_INVALID`,
          `MEDIA_ASSET_DUPLICATE_PART_NUMBER`,
          `MEDIA_ASSET_PART_COUNT_MISMATCH`, and
          `MEDIA_ASSET_PART_SEQUENCE_INVALID`, are detected before storage.
          Correct the parts payload, then retry the same active session.
        - `MEDIA_ASSET_REPLICA_INVALID`: replica access changed before writer
          acquisition or during exact resolution after storage work. Reload
          workspace replicas, the session, and the media asset before retrying
          with a currently accessible replica; do not assume rollback.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
    '403':
      description: |-
        Completion access changed. `MEDIA_ASSET_UPLOAD_SESSION_ACCESS_DENIED` or
        `WORKSPACE_ACCESS_DENIED` may be detected before storage or during exact
        resolution after storage work. Reload account and workspace access,
        session, and media-asset state before retrying; do not assume rollback.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
    '409':
      description: |-
        Completion conflict. Semantics depend on `error.code`:

        - `MEDIA_ASSET_UPLOAD_SESSION_RESTART_REQUIRED`: a legacy session was
          rejected before writer acquisition and storage mutation. Abort that
          session and create a replacement upload session.
        - `MEDIA_ASSET_UPLOAD_SESSION_EXPIRED`: expiry cleanup has already
          closed the session and may have performed S3 abort work. This session
          cannot be completed; create a fresh upload session and upload the
          bytes again instead of retrying the same completion request.
        - `MEDIA_ASSET_UPLOAD_SESSION_COMPLETION_IN_PROGRESS`: expiry cleanup
          raced durable completion. Abort admission made no database or S3
          mutation. Wait for `Retry-After`, then retry the unchanged completion
          request; do not start a replacement byte upload.
        - `MEDIA_ASSET_UPLOAD_SESSION_COMPLETED`: another completion won before
          or during expiry cleanup. This can be detected before or after S3
          abort work; reload or replay the completed asset and do not assume
          rollback.
        - `MEDIA_ASSET_UPLOAD_SESSION_STATE_CONFLICT`: terminal fingerprint,
          writer, or session state did not match. The conflict can be detected
          before storage or during exact resolution after storage work. Reload
          the session and do not assume rollback.
        - `MEDIA_ASSET_UPLOAD_MISMATCH` or
          `MEDIA_ASSET_UPLOAD_PROOF_MISMATCH`: completed or normalized bytes did
          not match the declared upload. Storage work may already have occurred.
          Reload the session and media asset first; if no completed asset
          exists, close the stale session as allowed and create a fresh upload
          with the correct bytes and metadata. Do not assume rollback.
        - `MEDIA_ASSET_UPLOAD_NOT_FOUND`: the multipart upload or completed
          object was unavailable after storage work may have been attempted.
          Reload the session and media asset first. If no completion is pending
          or applied, create a fresh upload session. Do not assume rollback.
      headers:
        Retry-After:
          description: >-
            Seconds to wait only when
            `MEDIA_ASSET_UPLOAD_SESSION_COMPLETION_IN_PROGRESS` supplies a
            retry delay.
          schema:
            type: string
          example: '1'
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
    '404':
      description: |-
        `MEDIA_ASSET_UPLOAD_SESSION_NOT_FOUND` means the session identifier is
        wrong or stale. The session can disappear before storage starts or
        during exact resolution after storage work. Reload canonical upload
        session and media-asset state, correct a wrong identifier, and create a
        fresh session only after confirming that no completion is pending or
        applied. Do not blindly retry this completion or assume rollback.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
    '503':
      description: |-
        Transient completion failure. Semantics depend on `error.code`:

        - `MEDIA_ASSET_UPLOAD_SESSION_COMPLETION_IN_PROGRESS`: completion is
          durably reconciled. Wait for `Retry-After`, then retry the unchanged
          session and parts without aborting or replacing the upload.
        - `MEDIA_ASSET_UPLOAD_SESSION_COMPLETION_DEADLINE_EXCEEDED`: the request
          exhausted its safe foreground budget. Wait for `Retry-After`, then
          retry the unchanged session and parts without aborting or replacing
          the upload.
        - `MEDIA_ASSET_STORAGE_UNAVAILABLE`: storage completion or promotion
          failed and its mutation outcome may be unknown. Retry the same
          completion request; do not assume rollback.
        - `MEDIA_BLOB_LIFECYCLE_BUSY`: blob cleanup temporarily fences database
          application. Wait for `Retry-After`, then retry the same completion
          request; do not assume earlier storage work was rolled back.
        - `SERVICE_UNAVAILABLE`: a database outcome may be unknown. Wait for
          `Retry-After`, retry the same completion request, and do not assume
          rollback.
      headers:
        Retry-After:
          description: >-
            Seconds to wait when the error variant supplies a retry delay.
            Storage-unavailable responses may omit this header.
          schema:
            type: string
          example: '1'
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
          example:
            ok: false
            data: {}
            instructions: >-
              Wait for Retry-After, then retry this completion with the same
              session and parts. Do not abort the session or create a
              replacement upload while completion is in progress.
            docs:
              openapiUrl: https://api.flashcards-open-source-app.com/v1/agent/openapi.json
              docsUrl: https://flashcards-open-source-app.com/docs/
            error:
              code: MEDIA_ASSET_UPLOAD_SESSION_COMPLETION_IN_PROGRESS
              message: Multipart completion was accepted for durable processing.
    '500':
      description: |-
        `DATABASE_COMMIT_OUTCOME_UNKNOWN` means a completion database commit
        response was lost and rollback is not guaranteed. Reload or replay the
        exact completion with the same session and parts to observe canonical
        state before taking any other action; do not abort or replace the
        upload.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
    default:
      description: Authenticated request error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
