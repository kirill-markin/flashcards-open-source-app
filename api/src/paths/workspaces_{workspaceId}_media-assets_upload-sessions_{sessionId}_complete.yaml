post:
  tags:
    - media-assets
  summary: Complete a multipart media asset upload session
  description: >-
    Completes the backend-controlled multipart upload, validates the stored
    object metadata, and creates or idempotently updates the workspace logical
    media asset.
  security:
    - ApiKeyHeader: []
  parameters:
    - name: workspaceId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UuidString.yaml
    - name: sessionId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UuidString.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CompleteMediaAssetUploadSessionInput.yaml
  responses:
    '200':
      description: Media asset upload completed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MediaAssetMutationResponse.yaml
    default:
      description: Authenticated request error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
