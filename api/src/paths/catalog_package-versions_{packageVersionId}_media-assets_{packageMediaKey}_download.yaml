get:
  tags:
    - public-catalog
  summary: Download public package media bytes
  description: >-
    Verifies that the package version is published and that the package-local
    media key belongs to that version, then streams the media bytes through the
    backend without exposing private object-storage keys.
  parameters:
    - name: packageVersionId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UuidString.yaml
    - name: packageMediaKey
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
  responses:
    '200':
      description: Public package media bytes
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
        image/webp:
          schema:
            type: string
            format: binary
    default:
      description: Public catalog request error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PublicErrorEnvelope.yaml
