post:
  tags:
    - catalog-install
  summary: Install a catalog package version
  description: >-
    Installs a published catalog package version into the target workspace by
    creating normal workspace cards and fresh logical workspace media assets.
    Workspace media assets point to the existing catalog media blob ids; this
    route does not copy physical object-storage bytes. The backend rewrites
    package-local fcasset media keys in card markdown to the newly created
    workspace mediaAssetId values and records normal hot-sync changes for the
    created cards and media assets. Source tags can be removed and one editable
    import tag can be added with the same options as ZIP import. Omitted tag
    options preserve source tags without adding an import tag. Cards are
    inserted in ordinal order with unique createdAt timestamps one millisecond
    apart; metadata.source.importedAt remains the common installedAt value. The
    caller-provided installId is a workspace-scoped idempotency key. After a
    completed install, an identical normalized retry returns the exact original
    successful result without creating more cards, media assets, or sync
    operations. Reusing installId with a different request returns
    CATALOG_PACKAGE_INSTALL_IDEMPOTENCY_CONFLICT. A new installId performs an
    explicit repeat import. Derived operation ids must remain unique; unrelated
    operation collisions return CATALOG_PACKAGE_INSTALL_OPERATION_ALREADY_EXISTS
    and are never treated as a successful replay.
  security:
    - ApiKeyHeader: []
  parameters:
    - name: workspaceId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/WorkspaceIdString.yaml
    - name: packageVersionId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UuidString.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CatalogPackageInstallConfirmInput.yaml
  responses:
    '200':
      description: Catalog package install result
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CatalogPackageInstallConfirmResponse.yaml
    default:
      description: Authenticated request error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
