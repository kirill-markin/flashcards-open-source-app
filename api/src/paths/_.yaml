get:
  tags:
    - discovery
  summary: Discovery alias
  description: >-
    Primary discovery entrypoint. Returns the same compact envelope as GET
    /agent.
  responses:
    '200':
      description: Agent discovery envelope
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentDiscoveryEnvelope.yaml
          example:
            ok: true
            data:
              service:
                name: flashcards-open-source-app
                version: v1
                description: >-
                  Offline-first flashcards service with user-owned workspaces
                  and a compact SQL agent surface, and direct media transfer
                  URLs.
              authentication:
                type: email_otp_then_api_key
                sendCodeUrl: https://auth.flashcards-open-source-app.com/api/agent/send-code
                verifyCodeUrl: https://auth.flashcards-open-source-app.com/api/agent/verify-code
              capabilitiesAfterLogin:
                - Load account context
                - Select a workspace
                - Run SQL reads through POST /agent/sql/query
                - Run SQL writes through POST /agent/sql/execute
                - Inspect the published SQL surface
                - Ingest JPEG, PNG, and WebP media images through the workspace-scoped image endpoint
                - Upload and complete media assets through workspace-scoped direct transfer endpoints
                - Read media asset metadata and create download URLs through workspace-scoped media endpoints
                - Preview and download portable workspace package ZIP exports, and preview or confirm ZIP imports
                - Preview and install published catalog package versions into a workspace
              authBaseUrl: https://auth.flashcards-open-source-app.com
              apiBaseUrl: https://api.flashcards-open-source-app.com/v1
              surface:
                accountUrl: https://api.flashcards-open-source-app.com/v1/agent/me
                workspacesUrl: https://api.flashcards-open-source-app.com/v1/agent/workspaces
                sqlQueryUrl: https://api.flashcards-open-source-app.com/v1/agent/sql/query
                sqlExecuteUrl: https://api.flashcards-open-source-app.com/v1/agent/sql/execute
                mediaAssetImageIngestionUrlTemplate: https://api.flashcards-open-source-app.com/v1/workspaces/{workspaceId}/media-assets/images
                mediaAssetUploadSessionCreateUrlTemplate: https://api.flashcards-open-source-app.com/v1/workspaces/{workspaceId}/media-assets/upload-sessions
                mediaAssetUploadSessionPartsUrlTemplate: https://api.flashcards-open-source-app.com/v1/workspaces/{workspaceId}/media-assets/upload-sessions/{sessionId}/parts
                mediaAssetUploadSessionCompleteUrlTemplate: https://api.flashcards-open-source-app.com/v1/workspaces/{workspaceId}/media-assets/upload-sessions/{sessionId}/complete
                mediaAssetUploadSessionAbortUrlTemplate: https://api.flashcards-open-source-app.com/v1/workspaces/{workspaceId}/media-assets/upload-sessions/{sessionId}/abort
                mediaAssetMetadataUrlTemplate: https://api.flashcards-open-source-app.com/v1/workspaces/{workspaceId}/media-assets/{mediaAssetId}
                mediaAssetDownloadUrlTemplate: https://api.flashcards-open-source-app.com/v1/workspaces/{workspaceId}/media-assets/{mediaAssetId}/download-url
                workspacePackageExportPreviewUrlTemplate: https://api.flashcards-open-source-app.com/v1/workspaces/{workspaceId}/packages/export/preview
                workspacePackageExportUrlTemplate: https://api.flashcards-open-source-app.com/v1/workspaces/{workspaceId}/packages/export
                workspacePackageImportPreviewUrlTemplate: https://api.flashcards-open-source-app.com/v1/workspaces/{workspaceId}/packages/import/preview
                workspacePackageImportUrlTemplate: https://api.flashcards-open-source-app.com/v1/workspaces/{workspaceId}/packages/import
                catalogPackageInstallPreviewUrlTemplate: https://api.flashcards-open-source-app.com/v1/workspaces/{workspaceId}/catalog/package-versions/{packageVersionId}/install/preview
                catalogPackageInstallUrlTemplate: https://api.flashcards-open-source-app.com/v1/workspaces/{workspaceId}/catalog/package-versions/{packageVersionId}/install
              mcp:
                url: https://mcp.flashcards-open-source-app.com/mcp
                description: >-
                  Remote MCP server for AI clients that connect through custom
                  connectors (for example Claude.ai or ChatGPT). Add the url as a
                  custom connector and authorize through OAuth, then use the
                  sql_query tool to read and the sql_execute tool to write cards
                  and decks. Headless or CLI clients may instead send
                  Authorization: Bearer fca_… using the agent API key from
                  email_otp_then_api_key login (the same key as the REST agent
                  surface), with no OAuth or browser needed.
                authorization:
                  type: oauth2
                  authorizationServer: https://auth.flashcards-open-source-app.com
                  authorizationServerMetadataUrl: https://auth.flashcards-open-source-app.com/.well-known/oauth-authorization-server
                  protectedResourceMetadataUrl: https://mcp.flashcards-open-source-app.com/.well-known/oauth-protected-resource
                apiKeyBearer:
                  type: api_key
                  header: Authorization
                  scheme: Bearer
                  description: >-
                    Send the agent API key (fca_…) as a Bearer token for
                    headless/CLI use; same key as the REST agent surface.
            instructions: >-
              Start with agent auth bootstrap. First call POST
              https://auth.flashcards-open-source-app.com/api/agent/send-code
              with the user's email. After send-code, follow the returned
              instructions: normal accounts require the 8-digit email code,
              while configured review/demo accounts use a deterministic 8-digit
              placeholder and do not send email. Do not immediately replay
              send-code. Then call POST
              https://auth.flashcards-open-source-app.com/api/agent/verify-code
              with the otpSessionToken, code, and label to obtain a long-lived
              API key. After login, call GET /v1/agent/me, then GET
              /v1/agent/workspaces?limit=100. If no workspace is selected,
              select one before using POST /v1/agent/sql/query for reads or
              POST /v1/agent/sql/execute for writes. After workspace selection,
              call GET /v1/agent/me and use data.agentWorkspaceReplicaId as
              lastModifiedByReplicaId when creating media upload sessions. For routine low-risk
              writes, a clear user request already counts as permission. Ask
              again only for risky or unclear actions. For media assets, create
              JPEG, PNG, or WebP image assets up to 4000000 bytes with POST
              /v1/workspaces/{workspaceId}/media-assets/images. For other media
              assets, create a multipart upload session with POST
              /v1/workspaces/{workspaceId}/media-assets/upload-sessions. If
              status is already_available, use the returned mediaAsset and skip
              byte upload. If status is upload_required, request signed part
              URLs with POST
              /v1/workspaces/{workspaceId}/media-assets/upload-sessions/{sessionId}/parts,
              upload each part with the returned signed URL, method, and
              headers, then complete the upload with POST
              /v1/workspaces/{workspaceId}/media-assets/upload-sessions/{sessionId}/complete.
              Abort unused sessions with POST
              /v1/workspaces/{workspaceId}/media-assets/upload-sessions/{sessionId}/abort.
              Use GET /v1/workspaces/{workspaceId}/media-assets/{mediaAssetId}
              for registry metadata and GET
              /v1/workspaces/{workspaceId}/media-assets/{mediaAssetId}/download-url
              for a range-capable direct download URL. Use POST
              /v1/workspaces/{workspaceId}/packages/export/preview to preview a
              portable workspace package export, then POST
              /v1/workspaces/{workspaceId}/packages/export to download the ZIP.
              Use POST
              /v1/workspaces/{workspaceId}/packages/import/preview with
              application/zip bytes up to 4000000 bytes to preview a portable
              workspace package import. Confirm with POST
              /v1/workspaces/{workspaceId}/packages/import as
              multipart/form-data with file ZIP bytes up to 4000000 bytes and
              an options JSON string. Use POST
              /v1/workspaces/{workspaceId}/catalog/package-versions/{packageVersionId}/install/preview
              to preview installing a published catalog package version, then
              POST
              /v1/workspaces/{workspaceId}/catalog/package-versions/{packageVersionId}/install
              with a unique installId and operationIdPrefix to create normal
              cards and logical media assets without copying object-storage
              bytes.
              Use docs.openapiUrl for the published external agent contract.
            links:
              websiteUrl: https://flashcards-open-source-app.com/
              privacyUrl: https://flashcards-open-source-app.com/privacy/
              termsUrl: https://flashcards-open-source-app.com/terms/
              supportUrl: https://flashcards-open-source-app.com/support/
              docsUrl: https://flashcards-open-source-app.com/docs/
            docs:
              openapiUrl: https://api.flashcards-open-source-app.com/v1/agent/openapi.json
              docsUrl: https://flashcards-open-source-app.com/docs/
