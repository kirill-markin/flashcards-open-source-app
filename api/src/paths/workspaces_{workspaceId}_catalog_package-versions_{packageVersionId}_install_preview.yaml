post:
  tags:
    - catalog-install
  summary: Preview a catalog package install
  description: >-
    Returns the published catalog package version metadata and the number of
    cards and logical media assets that would be created in the target
    workspace. The path workspaceId is authoritative for workspace access.
    Draft, submitted, approved, rejected, needs_changes, and delisted package
    versions are rejected.
  security:
    - ApiKeyHeader: []
  parameters:
    - name: workspaceId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UuidString.yaml
    - name: packageVersionId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UuidString.yaml
  responses:
    '200':
      description: Catalog package install preview
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CatalogPackageInstallPreviewResponse.yaml
    default:
      description: Authenticated request error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentErrorEnvelope.yaml
