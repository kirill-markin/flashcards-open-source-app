type: object
description: >-
  Request presigned URLs for direct S3 multipart upload parts. This request
  describes part numbers and checksums only; it never carries media bytes.
additionalProperties: false
required:
  - parts
properties:
  parts:
    type: array
    minItems: 1
    maxItems: 100
    items:
      type: object
      additionalProperties: false
      required:
        - partNumber
        - sha256
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
        sha256:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
          description: SHA-256 digest of this individual part, not the full object.
