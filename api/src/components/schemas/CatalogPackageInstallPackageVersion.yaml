type: object
additionalProperties: false
required:
  - packageVersionId
  - packageId
  - versionNumber
  - slug
  - title
  - summary
  - description
  - languageTags
  - topicTags
  - license
  - contentWarning
  - coverPackageMediaKey
  - cardCount
  - createdAt
  - publishedAt
  - author
properties:
  packageVersionId:
    $ref: ./UuidString.yaml
  packageId:
    $ref: ./UuidString.yaml
  versionNumber:
    type: integer
    minimum: 1
  slug:
    type: string
  title:
    type: string
  summary:
    type: string
  description:
    type: string
  languageTags:
    type: array
    items:
      type: string
  topicTags:
    type: array
    items:
      type: string
  license:
    type: string
  contentWarning:
    type:
      - string
      - 'null'
  coverPackageMediaKey:
    type:
      - string
      - 'null'
  cardCount:
    type: integer
    minimum: 0
  createdAt:
    type: string
    format: date-time
  publishedAt:
    type:
      - string
      - 'null'
    format: date-time
  author:
    $ref: ./CatalogPackageInstallAuthor.yaml
