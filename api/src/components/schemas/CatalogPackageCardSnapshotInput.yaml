type: object
additionalProperties: false
required:
  - packageCardId
  - stableCardKey
  - ordinal
  - frontText
  - backText
  - cardType
  - metadata
  - tags
  - mediaAssetKeys
properties:
  packageCardId:
    $ref: ./UuidString.yaml
  stableCardKey:
    type: string
  ordinal:
    type: integer
    minimum: 1
  frontText:
    type: string
  backText:
    type: string
  cardType:
    type: string
    example: basic
  metadata:
    $ref: ./CatalogCardMetadata.yaml
  tags:
    type: array
    items:
      type: string
  mediaAssetKeys:
    type: array
    items:
      type: string
