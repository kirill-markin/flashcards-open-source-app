type: object
description: >-
  Confirms that a backend-controlled direct S3 multipart upload session was
  aborted. Any unused presigned part URLs for this session should be discarded.
additionalProperties: false
required:
  - sessionId
  - abortedAt
properties:
  sessionId:
    $ref: ./UuidString.yaml
  abortedAt:
    type: string
    format: date-time
