type: object
additionalProperties: false
required:
  - mediaAssetId
  - workspaceId
  - mimeType
  - sizeBytes
  - sha256
  - sourceUrl
  - createdAt
  - clientUpdatedAt
  - lastModifiedByReplicaId
  - lastOperationId
  - updatedAt
  - deletedAt
properties:
  mediaAssetId:
    $ref: ./UuidString.yaml
  workspaceId:
    $ref: ./UuidString.yaml
  mimeType:
    type: string
    example: image/png
  sizeBytes:
    type: integer
    format: int64
    minimum: 0
    example: 42817
  sha256:
    type: string
    pattern: ^[0-9a-f]{64}$
    example: 5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8
  sourceUrl:
    type:
      - string
      - 'null'
    format: uri
  createdAt:
    type: string
    format: date-time
  clientUpdatedAt:
    type: string
    format: date-time
  lastModifiedByReplicaId:
    $ref: ./UuidString.yaml
  lastOperationId:
    $ref: ./MediaAssetLastOperationIdResponse.yaml
  updatedAt:
    type: string
    format: date-time
  deletedAt:
    type:
      - string
      - 'null'
    format: date-time
