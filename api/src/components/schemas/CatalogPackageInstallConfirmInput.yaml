type: object
additionalProperties: false
required:
  - installId
  - installedAt
  - clientUpdatedAt
  - lastModifiedByReplicaId
  - operationIdPrefix
properties:
  installId:
    type: string
    minLength: 1
    maxLength: 128
    description: >-
      Caller-generated import/install id. The backend rejects reuse in the same
      workspace instead of silently deduplicating.
  installedAt:
    type: string
    format: date-time
  clientUpdatedAt:
    type: string
    format: date-time
  lastModifiedByReplicaId:
    $ref: ./UuidString.yaml
  operationIdPrefix:
    type: string
    minLength: 1
    maxLength: 1007
    pattern: '^([!-~]|[!-~][ -~]*[!-~])$'
    description: >-
      Printable ASCII prefix without leading or trailing spaces. The maximum
      reserves space for the longest :media:<index> suffix supported by the
      catalog installer. The backend rejects conflicts with existing workspace
      operation ids.
