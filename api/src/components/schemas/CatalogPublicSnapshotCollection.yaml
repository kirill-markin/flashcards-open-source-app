type: object
additionalProperties: false
required:
  - collectionId
  - slug
  - title
  - summary
  - description
  - languageTags
  - topicTags
  - coverPackageId
  - status
  - updatedAt
  - publishedAt
properties:
  collectionId:
    $ref: ./UuidString.yaml
  slug:
    type: string
  title:
    type: string
  summary:
    type: string
  description:
    type: string
  languageTags:
    type: array
    items:
      type: string
  topicTags:
    type: array
    items:
      type: string
  coverPackageId:
    oneOf:
      - $ref: ./UuidString.yaml
      - type: 'null'
    description: Null when the stored cover package is not public in this snapshot.
  status:
    type: string
    const: published
  updatedAt:
    type: string
    format: date-time
  publishedAt:
    type: string
    format: date-time
