type: object
additionalProperties: false
required:
  - cardCount
  - mediaAssetCount
  - installId
  - installedAt
  - keptTagCount
  - removedTagCount
  - importTag
properties:
  cardCount:
    type: integer
    minimum: 0
  mediaAssetCount:
    type: integer
    minimum: 0
  installId:
    type: string
  installedAt:
    type: string
    format: date-time
  keptTagCount:
    type: integer
    minimum: 0
  removedTagCount:
    type: integer
    minimum: 0
  importTag:
    type:
      - string
      - 'null'
