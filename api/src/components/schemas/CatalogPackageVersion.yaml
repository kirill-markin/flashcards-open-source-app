type: object
additionalProperties: false
required:
  - packageVersionId
  - packageId
  - versionNumber
  - status
  - slug
  - title
  - summary
  - description
  - languageTags
  - topicTags
  - license
  - contentWarning
  - coverPackageMediaKey
  - sourceWorkspaceId
  - cardCount
  - createdByAdminEmail
  - reviewedByAdminEmail
  - createdAt
  - updatedAt
  - submittedAt
  - reviewedAt
  - publishedAt
  - delistedAt
properties:
  packageVersionId:
    $ref: ./UuidString.yaml
  packageId:
    $ref: ./UuidString.yaml
  versionNumber:
    type: integer
    minimum: 1
  status:
    $ref: ./CatalogPackageStatus.yaml
  slug:
    type: string
  title:
    type: string
  summary:
    type: string
  description:
    type: string
  languageTags:
    type: array
    items:
      type: string
  topicTags:
    type: array
    items:
      type: string
  license:
    type: string
  contentWarning:
    type:
      - string
      - 'null'
  coverPackageMediaKey:
    type:
      - string
      - 'null'
  sourceWorkspaceId:
    oneOf:
      - $ref: ./WorkspaceIdString.yaml
      - type: 'null'
  cardCount:
    type: integer
    minimum: 0
  createdByAdminEmail:
    type: string
  reviewedByAdminEmail:
    type:
      - string
      - 'null'
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
  submittedAt:
    type:
      - string
      - 'null'
    format: date-time
  reviewedAt:
    type:
      - string
      - 'null'
    format: date-time
  publishedAt:
    type:
      - string
      - 'null'
    format: date-time
  delistedAt:
    type:
      - string
      - 'null'
    format: date-time
