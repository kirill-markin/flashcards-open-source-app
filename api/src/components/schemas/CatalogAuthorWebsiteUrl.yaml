type:
  - string
  - 'null'
format: uri
pattern: >-
  ^[Hh][Tt][Tt][Pp][Ss]?://(?![^/?#]*@)(?:\[(?![0-9A-Fa-f:.]*:::)(?=[0-9A-Fa-f:.]*:)[0-9A-Fa-f:.]+\]|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])|(?![0-9.]+(?=[:/?#]|$))(?:[A-Za-z0-9._~!$&'()*+,;=-]|%[0-9A-Fa-f]{2})+)(?::(?:[0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(?:[/?#](?:[A-Za-z0-9\-._~:/?#@!$&'()*+,;=]|%[0-9A-Fa-f]{2})*)?$
description: Credential-free absolute HTTP(S) URL with a valid non-empty DNS, IPv4, or IPv6 authority and port, no surrounding whitespace, and no empty port, or null. Scheme spelling is case-insensitive.
