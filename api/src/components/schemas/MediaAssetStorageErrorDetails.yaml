type: object
additionalProperties: false
required:
  - operation
  - workspaceId
  - mediaAssetId
  - storageKey
  - bucketName
  - s3StatusCode
  - s3ErrorClass
  - s3ErrorMessage
properties:
  operation:
    type: string
    example: head_object
  workspaceId:
    $ref: ./UuidString.yaml
  mediaAssetId:
    $ref: ./UuidString.yaml
  storageKey:
    type: string
  bucketName:
    type: string
  s3StatusCode:
    type:
      - integer
      - 'null'
    example: 404
  s3ErrorClass:
    type: string
    example: NoSuchKey
  s3ErrorMessage:
    type: string
    example: Not Found
