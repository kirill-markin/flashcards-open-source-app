type: object
additionalProperties: false
required:
  - operation
  - workspaceId
  - mediaAssetId
  - s3StatusCode
  - s3ErrorClass
properties:
  operation:
    type: string
    example: head_object
  workspaceId:
    $ref: ./UuidString.yaml
  mediaAssetId:
    $ref: ./UuidString.yaml
  s3StatusCode:
    type:
      - integer
      - 'null'
    example: 404
  s3ErrorClass:
    type: string
    example: NoSuchKey
