type: object
additionalProperties: false
required:
  - mediaAsset
  - download
properties:
  mediaAsset:
    $ref: ./CatalogPublicPackageMediaAsset.yaml
  download:
    type: object
    additionalProperties: false
    required:
      - method
      - url
      - expiresAt
      - rangeRequests
    properties:
      method:
        type: string
        enum:
          - GET
      url:
        type: string
        format: uri
      expiresAt:
        type: 'null'
      rangeRequests:
        type: boolean
        const: false
