type: object
description: >-
  Presigned direct S3 multipart upload URLs. Upload bytes with the returned PUT
  URLs and headers; do not send part bytes to the backend.
additionalProperties: false
required:
  - sessionId
  - partUrls
properties:
  sessionId:
    $ref: ./UuidString.yaml
  partUrls:
    type: array
    description: Each item authorizes one direct S3 UploadPart request.
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - partNumber
        - method
        - url
        - expiresAt
        - headers
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
        method:
          type: string
          enum:
            - PUT
        url:
          type: string
          format: uri
          description: Presigned S3 UploadPart URL for this part only.
        expiresAt:
          type: string
          format: date-time
        headers:
          type: object
          description: Headers that must be included exactly on the direct S3 PUT request.
          additionalProperties:
            type: string
          example:
            x-amz-checksum-sha256: XohImNooBHFR0OVvjccpJ3NgPQ1qq73WKhHvch0VQtg=
