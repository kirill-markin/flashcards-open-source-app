type: object
description: >-
  Completes a direct S3 multipart upload after every part has been uploaded to
  its presigned PUT URL. The backend finalizes S3 and records the logical media
  asset; it does not receive the media bytes.
additionalProperties: false
required:
  - parts
properties:
  parts:
    type: array
    minItems: 1
    maxItems: 10000
    description: Must contain every uploaded part from 1 through the session partCount.
    items:
      type: object
      additionalProperties: false
      required:
        - partNumber
        - eTag
        - sha256
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
        eTag:
          type: string
          minLength: 1
          maxLength: 256
          description: ETag returned by S3 after uploading this part to its presigned PUT URL.
        sha256:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
          description: SHA-256 digest of this individual part, matching the part URL request.
