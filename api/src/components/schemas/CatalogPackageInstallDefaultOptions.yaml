type: object
additionalProperties: false
required:
  - addImportTag
  - suggestedImportTag
  - keptTags
  - removedTags
properties:
  addImportTag:
    type: boolean
    description: Whether clients should add an import-session tag when confirming with the default options.
  suggestedImportTag:
    type: string
    description: >-
      Concrete default import tag suggested for this preview. Pass this value,
      or another explicit client-chosen tag, as importTag when confirming with
      addImportTag true.
  keptTags:
    type: array
    description: Catalog card tags kept by the default install tag policy.
    items:
      type: string
  removedTags:
    type: array
    description: Catalog card tags removed by the default install tag policy.
    items:
      type: string
