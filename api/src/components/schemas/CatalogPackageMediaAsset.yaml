type: object
additionalProperties: false
required:
  - packageMediaAssetId
  - packageId
  - packageVersionId
  - packageMediaKey
  - mediaBlobId
  - altText
  - credit
  - license
  - createdAt
  - updatedAt
properties:
  packageMediaAssetId:
    $ref: ./UuidString.yaml
  packageId:
    $ref: ./UuidString.yaml
  packageVersionId:
    oneOf:
      - $ref: ./UuidString.yaml
      - type: 'null'
  packageMediaKey:
    type: string
  mediaBlobId:
    $ref: ./UuidString.yaml
  altText:
    type:
      - string
      - 'null'
  credit:
    type:
      - string
      - 'null'
  license:
    type:
      - string
      - 'null'
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
