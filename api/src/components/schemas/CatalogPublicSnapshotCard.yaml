type: object
additionalProperties: false
required:
  - packageCardId
  - packageVersionId
  - ordinal
  - frontText
  - backText
  - cardType
  - tags
  - mediaAssetIds
properties:
  packageCardId:
    $ref: ./UuidString.yaml
  packageVersionId:
    $ref: ./UuidString.yaml
  ordinal:
    type: integer
    minimum: 1
  frontText:
    type: string
  backText:
    type: string
  cardType:
    type: string
  tags:
    type: array
    items:
      type: string
  mediaAssetIds:
    type: array
    items:
      $ref: ./UuidString.yaml
