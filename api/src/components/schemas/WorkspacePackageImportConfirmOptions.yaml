type: object
additionalProperties: false
required:
  - addImportTag
  - importTag
  - removeTags
  - importedAt
  - importId
  - clientUpdatedAt
  - lastModifiedByReplicaId
  - operationIdPrefix
properties:
  addImportTag:
    type: boolean
    description: When true, the backend appends importTag to every imported card after applying removeTags.
  importTag:
    type: string
    description: >-
      Explicit tag chosen by the client for this import. Required to be
      non-blank when addImportTag is true, and ignored when addImportTag is
      false.
  removeTags:
    type: array
    description: Exact package card tags to remove from imported cards before the optional importTag is added.
    items:
      type: string
      minLength: 1
  importedAt:
    type: string
    format: date-time
  importId:
    type: string
    minLength: 1
  clientUpdatedAt:
    type: string
    format: date-time
  lastModifiedByReplicaId:
    $ref: ./UuidString.yaml
  operationIdPrefix:
    type: string
    minLength: 1
    maxLength: 1013
    pattern: '^([!-~]|[!-~][ -~]*[!-~])$'
    description: >-
      Printable ASCII prefix without leading or trailing spaces. The maximum
      reserves space for the longest :media:<index> suffix supported by a
      workspace package import.
