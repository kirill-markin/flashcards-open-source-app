type: object
description: >-
  Result of preparing direct S3 media upload. When status is upload_required,
  the uploadSession only identifies the backend-controlled multipart upload;
  clients must request presigned part URLs and send bytes directly to S3.
additionalProperties: false
required:
  - workspaceId
  - mediaAssetId
  - status
  - mediaAsset
  - uploadSession
properties:
  workspaceId:
    $ref: ./WorkspaceIdString.yaml
  mediaAssetId:
    $ref: ./UuidString.yaml
  status:
    type: string
    enum:
      - already_available
      - upload_required
  mediaAsset:
    oneOf:
      - $ref: ./MediaAsset.yaml
      - type: 'null'
  uploadSession:
    description: >-
      Direct multipart upload session metadata. Null means the media bytes were
      already available and no upload is needed.
    oneOf:
      - type: object
        additionalProperties: false
        required:
          - sessionId
          - expiresAt
          - partSizeBytes
          - partCount
        properties:
          sessionId:
            $ref: ./UuidString.yaml
          expiresAt:
            type: string
            format: date-time
          partSizeBytes:
            type: integer
            format: int64
            minimum: 1
            description: Size in bytes clients should use for each direct S3 part except the final part.
          partCount:
            type: integer
            minimum: 1
            maximum: 10000
            description: Number of direct S3 parts clients must upload before completing the session.
      - type: 'null'
