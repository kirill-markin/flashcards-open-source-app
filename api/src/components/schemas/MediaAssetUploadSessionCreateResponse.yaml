type: object
additionalProperties: false
required:
  - workspaceId
  - mediaAssetId
  - status
  - mediaAsset
  - uploadSession
properties:
  workspaceId:
    $ref: ./UuidString.yaml
  mediaAssetId:
    $ref: ./UuidString.yaml
  status:
    type: string
    enum:
      - already_available
      - upload_required
  mediaAsset:
    oneOf:
      - $ref: ./MediaAsset.yaml
      - type: 'null'
  uploadSession:
    oneOf:
      - type: object
        additionalProperties: false
        required:
          - sessionId
          - expiresAt
          - partSizeBytes
          - partCount
        properties:
          sessionId:
            $ref: ./UuidString.yaml
          expiresAt:
            type: string
            format: date-time
          partSizeBytes:
            type: integer
            format: int64
            minimum: 1
          partCount:
            type: integer
            minimum: 1
            maximum: 10000
      - type: 'null'
