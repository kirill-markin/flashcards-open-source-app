type: object
additionalProperties: false
required:
  - packageMediaAssetId
  - packageVersionId
  - packageMediaKey
  - altText
  - credit
  - license
  - mimeType
  - sizeBytes
  - downloadUrl
properties:
  packageMediaAssetId:
    $ref: ./UuidString.yaml
  packageVersionId:
    $ref: ./UuidString.yaml
  packageMediaKey:
    type: string
    description: Public package-local media key.
  altText:
    type:
      - string
      - 'null'
  credit:
    type:
      - string
      - 'null'
  license:
    type:
      - string
      - 'null'
  mimeType:
    type: string
  sizeBytes:
    type: integer
    minimum: 0
  downloadUrl:
    type: string
    format: uri
    description: Absolute backend URL for the public media bytes.
