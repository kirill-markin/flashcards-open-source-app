options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _ANDROID_DEVICE_RUN_DEVICE: ''
  _ANDROID_DEVICE_RUN_RESULTS_BUCKET: ''

timeout: 3600s

steps:
  - id: Validate Device Run configuration
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        project_id="${PROJECT_ID}"
        device="${_ANDROID_DEVICE_RUN_DEVICE}"
        results_bucket="${_ANDROID_DEVICE_RUN_RESULTS_BUCKET}"
        missing_values=()

        if [[ -z "$${project_id}" ]]; then
          missing_values+=("PROJECT_ID")
        fi

        if [[ -z "$${device}" ]]; then
          missing_values+=("_ANDROID_DEVICE_RUN_DEVICE")
        fi

        if [[ -z "$${results_bucket}" ]]; then
          missing_values+=("_ANDROID_DEVICE_RUN_RESULTS_BUCKET")
        fi

        if [[ "$${#missing_values[@]}" -gt 0 ]]; then
          printf 'Missing required Cloud Build substitutions for Device Run: %s\n' "$${missing_values[*]}" >&2
          exit 1
        fi

  - id: Build Android CI image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - flashcards-android-ci:latest
      - --file
      - apps/android/ci/Dockerfile
      - .

  - id: Build debug app, test APK, and lint
    name: flashcards-android-ci:latest
    entrypoint: bash
    args:
      - -ceu
      - /workspace/scripts/android/run-android-ci.sh

  - id: Run Device Run instrumentation tests
    name: flashcards-android-ci:latest
    entrypoint: bash
    args:
      - -ceu
      - |
        device_run_args=(
          --project-id "${PROJECT_ID}"
          --device "${_ANDROID_DEVICE_RUN_DEVICE}"
          --app-path "/workspace/apps/android/app/build/outputs/apk/debug/app-debug.apk"
          --test-path "/workspace/apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          --timeout "30m"
          --max-session-duration "35m"
          --test-targets "package com.flashcardsopensourceapp.app"
          --test-targets "notAnnotation com.flashcardsopensourceapp.app.ManualOnlyAndroidTest"
          --results-bucket "${_ANDROID_DEVICE_RUN_RESULTS_BUCKET}"
          --labels "cloud_build_id=${BUILD_ID},target_sha=${COMMIT_SHA},suite=latest"
          --session-output "/workspace/device-run-session.json"
        )

        /workspace/scripts/android/run-android-device-run.sh "$${device_run_args[@]}"
