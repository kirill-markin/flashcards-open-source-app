name: Android Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Git SHA to release. Leave empty to release the selected workflow ref.
        required: false
        type: string
      localized_release_notes:
        description: Optional JSON list of {language,text} records using exact Google Play locale codes
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    name: Resolve Android release target
    runs-on: ubuntu-24.04
    outputs:
      play_notes_sha256: ${{ steps.release-notes.outputs.sha256 }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      android_version_code: ${{ steps.release-metadata.outputs.android_version_code }}
      android_version_name: ${{ steps.release-metadata.outputs.android_version_name }}
      android_target_short_sha: ${{ steps.release-metadata.outputs.android_target_short_sha }}
      android_release_id: ${{ steps.release-metadata.outputs.android_release_id }}
      android_play_release_name: ${{ steps.release-metadata.outputs.android_play_release_name }}
      android_wear_version_code: ${{ steps.release-metadata.outputs.android_wear_version_code }}
      android_wear_play_release_name: ${{ steps.release-metadata.outputs.android_wear_play_release_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve release target
        id: resolve
        env:
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          WORKFLOW_TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          target_sha="${INPUT_TARGET_SHA}"

          if [[ -z "${target_sha}" ]]; then
            target_sha="${WORKFLOW_TARGET_SHA}"
          fi

          target_sha="$(git rev-parse "${target_sha}")"

          {
            echo "target_sha=${target_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve Android release metadata
        id: release-metadata
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          base_epoch_seconds=1767225600
          current_epoch_seconds="$(date -u +%s)"
          # Even phone and odd Wear OS codes keep the form factors disjoint, and doubling
          # keeps every code above the earlier phone codes, which were plain seconds.
          version_code=$(( (current_epoch_seconds - base_epoch_seconds) * 2 ))
          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' apps/android/app/build.gradle.kts | head -n 1)"
          target_short_sha="$(printf '%s' "${TARGET_SHA}" | cut -c1-8)"
          release_id="vc${version_code}-r${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}-s${target_short_sha}"
          play_release_name="main-draft-${release_id}"
          wear_version_code=$(( version_code + 1 ))
          wear_play_release_name="main-draft-vc${wear_version_code}-r${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}-s${target_short_sha}"

          for code in "${version_code}" "${wear_version_code}"; do
            if [[ "${code}" -le 0 ]]; then
              echo "Resolved Android version code must be positive. Got: ${code}." >&2
              exit 1
            fi

            if [[ "${code}" -gt 2100000000 ]]; then
              echo "Resolved Android version code exceeds Google Play limit. Got: ${code}." >&2
              exit 1
            fi
          done

          if [[ -z "${version_name}" ]]; then
            echo "Could not resolve Android versionName from apps/android/app/build.gradle.kts." >&2
            exit 1
          fi

          if [[ "${#target_short_sha}" -ne 8 ]]; then
            echo "Resolved target SHA prefix must be 8 characters. Got: ${target_short_sha}." >&2
            exit 1
          fi

          {
            echo "android_version_code=${version_code}"
            echo "android_version_name=${version_name}"
            echo "android_target_short_sha=${target_short_sha}"
            echo "android_release_id=${release_id}"
            echo "android_play_release_name=${play_release_name}"
            echo "android_wear_version_code=${wear_version_code}"
            echo "android_wear_play_release_name=${wear_play_release_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out release-notes tooling from the workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts/android/play_release_notes.py
          sparse-checkout-cone-mode: false

      - name: Prepare localized Play release notes
        id: release-notes
        env:
          LOCALIZED_RELEASE_NOTES: ${{ inputs.localized_release_notes }}
          ARTIFACT_SOURCE_SHA: ${{ steps.resolve.outputs.target_sha }}
          ANDROID_VERSION_CODE: ${{ steps.release-metadata.outputs.android_version_code }}
          ANDROID_VERSION_NAME: ${{ steps.release-metadata.outputs.android_version_name }}
          PLAY_NOTES_PATH: ${{ runner.temp }}/release-notes.json
        run: python3 .release-tools/scripts/android/play_release_notes.py

      - name: Retain original Play release notes
        uses: actions/upload-artifact@v7
        with:
          name: android-release-notes-r${{ github.run_id }}a${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/release-notes.json

      - name: Summarize preflight
        run: |
          {
            echo "## Android release preflight"
            echo ""
            echo "- Target SHA: \`${{ steps.resolve.outputs.target_sha }}\`"
            echo "- Version code: \`${{ steps.release-metadata.outputs.android_version_code }}\`"
            echo "- Version name: \`${{ steps.release-metadata.outputs.android_version_name }}\`"
            echo "- Release ID: \`${{ steps.release-metadata.outputs.android_release_id }}\`"
            echo "- Play release name: \`${{ steps.release-metadata.outputs.android_play_release_name }}\`"
            echo "- Wear OS version code: \`${{ steps.release-metadata.outputs.android_wear_version_code }}\`"
            echo "- Wear OS Play release name: \`${{ steps.release-metadata.outputs.android_wear_play_release_name }}\`"
            echo "- Upload draft to Play: \`true\`"
            echo "- Play publish mode: \`draft production release uploaded by CI; final publish happens later in Play Console\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  android_ci:
    name: Android CI
    needs:
      - preflight
    concurrency:
      group: android-release-ci-main
      cancel-in-progress: true
    uses: ./.github/workflows/android-ci-reusable.yml
    with:
      target_ref: ${{ needs.preflight.outputs.target_sha }}
      android_version_code: ${{ needs.preflight.outputs.android_version_code }}
    secrets: inherit

  device_run_submission:
    name: Device Run app instrumentation
    needs:
      - preflight
      - android_ci
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.android_ci.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency:
      group: android-release-device-run-shared-account
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      ANDROID_DEVICE_RUN_DEVICE: ${{ vars.ANDROID_DEVICE_RUN_DEVICE }}
      ANDROID_DEVICE_RUN_COMPAT_DEVICES: ${{ vars.ANDROID_DEVICE_RUN_COMPAT_DEVICES }}
      ANDROID_DEVICE_RUN_RESULTS_BUCKET: ${{ vars.ANDROID_DEVICE_RUN_RESULTS_BUCKET }}
      RELEASE_ID: ${{ needs.preflight.outputs.android_release_id }}
      TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}

    steps:
      - name: Validate Device Run configuration
        run: |
          set -euo pipefail
          for variable_name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL \
            ANDROID_DEVICE_RUN_DEVICE ANDROID_DEVICE_RUN_COMPAT_DEVICES ANDROID_DEVICE_RUN_RESULTS_BUCKET; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Missing GitHub Actions variable ${variable_name}; see scripts/android/setup-github-android.sh." >&2
              exit 1
            fi
          done
          if [[ ! "${ANDROID_DEVICE_RUN_RESULTS_BUCKET}" =~ ^[a-z0-9][a-z0-9._-]+$ ]]; then
            echo "ANDROID_DEVICE_RUN_RESULTS_BUCKET must be a bucket name without gs:// or a path." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          version: '593.0.0'
          install_components: beta

      - name: Check out Device Run evidence tooling from the workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: |
            scripts/android/collect-device-run-evidence.py
            scripts/android/run-android-device-run.sh
          sparse-checkout-cone-mode: false

      - name: Require configured Device Run destinations in the current catalog
        run: |
          set -euo pipefail
          gcloud beta device-run devices list --project "${GCP_PROJECT_ID}" --location global --format=json \
            > "${RUNNER_TEMP}/device-run-catalog.json"
          python3 .release-tools/scripts/android/collect-device-run-evidence.py --prepare-destinations \
            > "${RUNNER_TEMP}/device-run-destinations.json"

      - name: Download debug APKs
        uses: actions/download-artifact@v8
        with:
          name: android-debug-apks
          path: /tmp/android-debug-apks

      - name: Resolve debug APK paths
        id: resolve-debug-apks
        run: |
          set -euo pipefail
          app_apk_path="$(find /tmp/android-debug-apks -type f -name 'app-debug.apk' | head -n 1)"
          test_apk_path="$(find /tmp/android-debug-apks -type f -name 'app-debug-androidTest.apk' | head -n 1)"
          if [[ -z "${app_apk_path}" || -z "${test_apk_path}" ]]; then
            echo "Expected app-debug.apk and app-debug-androidTest.apk in the run's Android CI artifact." >&2
            exit 1
          fi

          app_apk_hash="$(sha256sum "${app_apk_path}")"
          test_apk_hash="$(sha256sum "${test_apk_path}")"
          {
            printf 'APP_APK_PATH=%s\n' "${app_apk_path}"
            printf 'TEST_APK_PATH=%s\n' "${test_apk_path}"
            printf 'APP_APK_SHA256=%s\n' "${app_apk_hash%% *}"
            printf 'TEST_APK_SHA256=%s\n' "${test_apk_hash%% *}"
          } >> "${GITHUB_ENV}"

      - name: Run the pinned physical Device Run selections sequentially
        run: |
          set -euo pipefail
          evidence_tool=.release-tools/scripts/android/collect-device-run-evidence.py

          submit_session() {
            local device="$1" session_output="$2"
            bash .release-tools/scripts/android/run-android-device-run.sh \
              --project-id "${GCP_PROJECT_ID}" \
              --device "${device}" \
              --app-path "${APP_APK_PATH}" \
              --test-path "${TEST_APK_PATH}" \
              --timeout "${test_timeout}" \
              --max-session-duration "${max_session_duration}" \
              "${test_target_args[@]}" \
              --results-bucket "${ANDROID_DEVICE_RUN_RESULTS_BUCKET}" \
              --labels "release_id=${RELEASE_ID},target_sha=${TARGET_SHA},github_run_id=${GITHUB_RUN_ID},github_run_attempt=${GITHUB_RUN_ATTEMPT},suite=${suite}" \
              --session-output "${session_output}"
          }

          selection_schema="$(jq -r '.schemaVersion // 1' scripts/android/device-run-test-selection.json)"
          retry_used=false
          while IFS= read -r destination; do
            device="$(jq -r '.device' <<< "${destination}")"
            api="$(jq -r '.api' <<< "${destination}")"
            suite="$(jq -r '.suite' <<< "${destination}")"
            suffix="$(jq -r '.selection' <<< "${destination}")"
            log_prefix="${RUNNER_TEMP}/device-run-${suffix}"
            test_timeout=10m
            max_session_duration=35m
            if [[ "${api}" == "37" ]]; then
              test_timeout=15m
              max_session_duration=55m
            fi
            if [[ "${selection_schema}" == "1" ]]; then
              test_timeout=30m
            fi
            targets="$(jq -r '.targets[]' <<< "${destination}")"
            test_target_args=()
            while IFS= read -r target; do
              test_target_args+=(--test-targets "${target}")
            done <<< "${targets}"

            command_exit_code=0
            submit_session "${device}" "${log_prefix}-session.json" \
              > "${log_prefix}-submit.log" 2>&1 || command_exit_code=$?
            if [[ "${command_exit_code}" -ne 0 && "${retry_used}" == "false" ]] &&
              grep -Eq '^DEVICE_RUN_(TERMINAL_FAILURE|CANCELLED_AFTER_WAIT_TIMEOUT)=' "${log_prefix}-submit.log" &&
              timeout --kill-after=10s 3m python3 "${evidence_tool}" --classify-retry "${suffix}"; then
              retry_used=true
              retry_evidence="${RUNNER_TEMP}/device-run-retry-evidence.json"
              retry_device="$(jq -er '.effective_device' "${retry_evidence}")"
              reason="$(jq -er '.reason' "${retry_evidence}")"
              echo "::warning::API ${api}: ${reason}. Retrying once from ${device} on ${retry_device}."
              device="${retry_device}"
              command_exit_code=0
              submit_session "${device}" "${log_prefix}-retry-session.json" \
                > "${log_prefix}-retry-submit.log" 2>&1 || command_exit_code=$?
            fi

            if [[ "${command_exit_code}" -ne 0 ]]; then
              echo "Device Run failed. Device=${device} API=${api} Exit=${command_exit_code}. Inspect the native evidence." >&2
              exit "${command_exit_code}"
            fi
          done < <(jq -c '.[]' "${RUNNER_TEMP}/device-run-destinations.json")

      - name: Collect private native evidence and gate named results
        if: ${{ always() && steps.resolve-debug-apks.outcome == 'success' }}
        run: python3 .release-tools/scripts/android/collect-device-run-evidence.py

      - name: Preserve public-safe Device Run named results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-run-submissions
          if-no-files-found: ignore
          path: ${{ runner.temp }}/device-run-public/summary.json

      - name: Summarize Device Run terminal results
        if: always()
        run: |
          summary="${RUNNER_TEMP}/device-run-public/summary.json"
          {
            echo "## Device Run terminal results"
            echo ""
            echo "- Release ID: \`${RELEASE_ID}\`"
            echo "- Target SHA: \`${TARGET_SHA}\`"
            echo "- Named results and private evidence references: \`android-device-run-submissions\`"
            if [[ -f "${summary}" ]]; then
              echo ""
              echo "| API | Configured device | Effective device | Session | Outcome | Passed cases | Initial failed session |"
              echo "| --- | --- | --- | --- | --- | --- | --- |"
              jq -r '.sessions[] | "| \(.api) | \(.configured_device // .device) | \(.device) | \(.session_id // "n/a") | \(if .passed then "passed" else "failed" end) | \(.counts.passed // 0)/\(.expected_count // "?") | \(.initial_failure.session_id // "n/a") |"' "${summary}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  build_signed_android:
    name: Build and verify signed Android App Bundle
    needs:
      - preflight
      - android_ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      aab_sha256: ${{ steps.bundle.outputs.sha256 }}
      wear_aab_sha256: ${{ steps.bundle.outputs.wear_sha256 }}
    env:
      AAB_PATH: apps/android/app/build/outputs/bundle/release/app-release.aab
      WEAR_AAB_PATH: apps/android/wear/build/outputs/bundle/release/wear-release.aab
      ANDROID_VERSION_CODE: ${{ needs.preflight.outputs.android_version_code }}
      ANDROID_WEAR_VERSION_CODE: ${{ needs.preflight.outputs.android_wear_version_code }}
      ANDROID_SENTRY_DSN: ${{ vars.ANDROID_SENTRY_DSN }}
      ANDROID_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.ANDROID_SENTRY_TRACES_SAMPLE_RATE || '0' }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_ANDROID_PROJECT: ${{ vars.SENTRY_ANDROID_PROJECT }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}

      - name: Validate Android Sentry configuration
        env:
          ANDROID_SENTRY_DSN: ${{ vars.ANDROID_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_ANDROID_PROJECT: ${{ vars.SENTRY_ANDROID_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          missing_values=()

          for variable_name in \
            ANDROID_SENTRY_DSN \
            SENTRY_ORG \
            SENTRY_ANDROID_PROJECT \
            SENTRY_AUTH_TOKEN; do
            if [[ -z "${!variable_name}" ]]; then
              missing_values+=("${variable_name}")
            fi
          done

          if [[ "${#missing_values[@]}" -gt 0 ]]; then
            printf 'Missing required Android Sentry release values: %s\n' "${missing_values[*]}" >&2
            echo "Configure repository variables/secrets or run bash scripts/android/setup-github-android.sh." >&2
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Install Android SDK packages
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"

      - name: Validate Android signing secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing_secrets=()

          for secret_name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS \
            ANDROID_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              missing_secrets+=("${secret_name}")
            fi
          done

          if [[ "${#missing_secrets[@]}" -gt 0 ]]; then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing_secrets[*]}" >&2
            echo "Configure them in the GitHub repository settings or with bash scripts/android/setup-github-android.sh." >&2
            exit 1
          fi

      - name: Prepare Android upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          keystore_path="${RUNNER_TEMP}/android-upload-key.jks"
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"

          if [[ ! -s "${keystore_path}" ]]; then
            echo "Decoded Android upload keystore is empty." >&2
            exit 1
          fi

          printf 'ANDROID_KEYSTORE_PATH=%s\n' "${keystore_path}" >> "${GITHUB_ENV}"

      - name: Build signed Android App Bundle
        env:
          ANDROID_RELEASE_STORE_FILE: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          bash scripts/android/run-android-release.sh \
            --version-code "${ANDROID_VERSION_CODE}" \
            --wear-version-code "${ANDROID_WEAR_VERSION_CODE}"

      - name: Record signed Android App Bundle checksum
        id: bundle
        run: |
          set -euo pipefail
          aab_sha256="$(sha256sum "${AAB_PATH}" | cut -d ' ' -f 1)"
          wear_aab_sha256="$(sha256sum "${WEAR_AAB_PATH}" | cut -d ' ' -f 1)"
          {
            echo "sha256=${aab_sha256}"
            echo "wear_sha256=${wear_aab_sha256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload signed Android App Bundle artifact
        id: upload-bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-release-bundle-r${{ github.run_id }}a${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ env.AAB_PATH }}

      - name: Upload signed Wear OS App Bundle artifact
        id: upload-wear-bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-wear-release-bundle-r${{ github.run_id }}a${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ env.WEAR_AAB_PATH }}

      - name: Report and gate R8 optimization coverage
        env:
          ANDROID_R8_MIN_COVERAGE_PERCENT: '25'
        run: |
          set -euo pipefail

          failures=()

          gate_r8_coverage() {
            local bundle_label="$1" aab_path="$2"
            local r8_metadata_path="${RUNNER_TEMP}/android-release-r8-${bundle_label}.json"

            if ! unzip -p "${aab_path}" "BUNDLE-METADATA/com.android.tools/r8.json" > "${r8_metadata_path}"; then
              echo "BUNDLE-METADATA/com.android.tools/r8.json is missing from ${aab_path}. R8 optimization coverage cannot be verified." >&2
              exit 1
            fi

            if [[ "$(jq -r 'try ((.stats.noShrinkingPercentage | numbers) != null) catch false' "${r8_metadata_path}")" != "true" ]]; then
              echo "R8 metadata in ${aab_path} has no usable stats object." >&2
              cat "${r8_metadata_path}" >&2
              exit 1
            fi

            local r8_version coverage_report
            r8_version="$(jq -r '.version // "unknown"' "${r8_metadata_path}")"
            coverage_report="$(
              jq -r '
                .stats
                | [
                    ["Shrinking", ((100 - .noShrinkingPercentage) * 100 | round / 100)],
                    ["Optimization", ((100 - .noOptimizationPercentage) * 100 | round / 100)],
                    ["Obfuscation", ((100 - .noObfuscationPercentage) * 100 | round / 100)]
                  ]
                | .[]
                | "\(.[0])\t\(.[1])"
              ' "${r8_metadata_path}"
            )"

            local summary_lines=() category coverage
            while IFS=$'\t' read -r category coverage; do
              summary_lines+=("- ${category} coverage: \`${coverage}%\`")
              if ! awk -v value="${coverage}" -v minimum="${ANDROID_R8_MIN_COVERAGE_PERCENT}" 'BEGIN { exit !(value >= minimum) }'; then
                failures+=("${bundle_label} ${category} coverage ${coverage}% is below the required ${ANDROID_R8_MIN_COVERAGE_PERCENT}%")
              fi
            done <<< "${coverage_report}"

            {
              echo "## Android R8 optimization coverage: ${bundle_label}"
              echo ""
              echo "- Bundle: \`${aab_path}\`"
              echo "- R8 version: \`${r8_version}\`"
              echo "- Google Play minimum per category: \`${ANDROID_R8_MIN_COVERAGE_PERCENT}%\`"
              printf '%s\n' "${summary_lines[@]}"
            } >> "${GITHUB_STEP_SUMMARY}"

            echo "${bundle_label} bundle:"
            printf '%s\n' "${summary_lines[@]}"
          }

          gate_r8_coverage phone "${AAB_PATH}"
          gate_r8_coverage wear "${WEAR_AAB_PATH}"

          if [[ "${#failures[@]}" -gt 0 ]]; then
            printf 'R8 optimization coverage gate failed: %s\n' "${failures[*]}" >&2
            exit 1
          fi

      - name: Summarize signed Android App Bundle
        env:
          AAB_SHA256: ${{ steps.bundle.outputs.sha256 }}
          BUNDLE_ARTIFACT_URL: ${{ steps.upload-bundle.outputs.artifact-url }}
          BUNDLE_ARTIFACT_ID: ${{ steps.upload-bundle.outputs.artifact-id }}
          WEAR_AAB_SHA256: ${{ steps.bundle.outputs.wear_sha256 }}
          WEAR_BUNDLE_ARTIFACT_URL: ${{ steps.upload-wear-bundle.outputs.artifact-url }}
          WEAR_BUNDLE_ARTIFACT_ID: ${{ steps.upload-wear-bundle.outputs.artifact-id }}
        run: |
          {
            echo "## Signed Android App Bundle"
            echo ""
            echo "- Bundle artifact: [${BUNDLE_ARTIFACT_ID}](${BUNDLE_ARTIFACT_URL})"
            echo "- Bundle SHA-256: \`${AAB_SHA256}\`"
            echo "- Wear OS bundle artifact: [${WEAR_BUNDLE_ARTIFACT_ID}](${WEAR_BUNDLE_ARTIFACT_URL})"
            echo "- Wear OS bundle SHA-256: \`${WEAR_AAB_SHA256}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish_android:
    name: Upload Android bundle to Google Play production draft release
    needs:
      - preflight
      - android_ci
      - device_run_submission
      - build_signed_android
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.android_ci.result == 'success' && needs.device_run_submission.result == 'success' && needs.build_signed_android.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: android-release-publish-main
      cancel-in-progress: false
    env:
      ANDROID_VERSION_CODE: ${{ needs.preflight.outputs.android_version_code }}
      ANDROID_VERSION_NAME: ${{ needs.preflight.outputs.android_version_name }}
      ANDROID_RELEASE_ID: ${{ needs.preflight.outputs.android_release_id }}
      ANDROID_PLAY_RELEASE_NAME: ${{ needs.preflight.outputs.android_play_release_name }}

    steps:
      - name: Validate Google Play configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_PLAY_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT_EMAIL }}
          ANDROID_PLAY_PACKAGE_NAME: ${{ vars.ANDROID_PLAY_PACKAGE_NAME }}
        run: |
          missing_values=()

          for variable_name in \
            GCP_PROJECT_ID \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_PLAY_SERVICE_ACCOUNT_EMAIL \
            ANDROID_PLAY_PACKAGE_NAME; do
            if [[ -z "${!variable_name}" ]]; then
              missing_values+=("${variable_name}")
            fi
          done

          if [[ "${#missing_values[@]}" -gt 0 ]]; then
            printf 'Missing required GitHub Actions variables: %s\n' "${missing_values[*]}" >&2
            echo "Configure them in the GitHub repository settings or with bash scripts/android/setup-github-android.sh." >&2
            exit 1
          fi

      - name: Check out publisher tooling from the workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/android/publish-play-draft.py
            scripts/android/play_release_notes.py
          sparse-checkout-cone-mode: false

      - name: Download signed Android App Bundle for this attempt
        uses: actions/download-artifact@v8
        with:
          name: android-release-bundle-r${{ github.run_id }}a${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-release-bundle

      - name: Download original Play release notes
        uses: actions/download-artifact@v8
        with:
          name: android-release-notes-r${{ github.run_id }}a${{ github.run_attempt }}
          path: ${{ runner.temp }}/play-release-notes

      - name: Authenticate to Google Play
        uses: google-github-actions/auth@v3
        id: auth
        with:
          create_credentials_file: false
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Upload bundle to Google Play production track as draft release
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          AAB_PATH: ${{ runner.temp }}/android-release-bundle/app-release.aab
          AAB_SHA256: ${{ needs.build_signed_android.outputs.aab_sha256 }}
          ANDROID_PLAY_PACKAGE_NAME: ${{ vars.ANDROID_PLAY_PACKAGE_NAME }}
          ANDROID_PLAY_TRACK: production
          ARTIFACT_SOURCE_SHA: ${{ needs.preflight.outputs.target_sha }}
          PLAY_PROVENANCE_PATH: ${{ runner.temp }}/play-publisher-provenance.json
          PLAY_NOTES_PATH: ${{ runner.temp }}/play-release-notes/release-notes.json
          PLAY_NOTES_SHA256: ${{ needs.preflight.outputs.play_notes_sha256 }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 .release-tools/scripts/android/publish-play-draft.py

      - name: Retain Play publisher correlation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-play-publisher-provenance
          if-no-files-found: ignore
          path: ${{ runner.temp }}/play-publisher-provenance.json

      - name: Summarize Play draft upload
        run: |
          {
            echo "## Android Play draft upload"
            echo ""
            echo "- Release ID: \`${ANDROID_RELEASE_ID}\`"
            echo "- Production track release name: \`${ANDROID_PLAY_RELEASE_NAME}\`"
            echo "- Sentry release: \`com.flashcardsopensourceapp.app@${ANDROID_VERSION_NAME}+${ANDROID_VERSION_CODE}\`"
            echo "- Version code: \`${ANDROID_VERSION_CODE}\`"
            echo "- Version name: \`${ANDROID_VERSION_NAME}\`"
            echo "- Target SHA: \`${{ needs.preflight.outputs.target_sha }}\`"
            echo "- GitHub run: \`${{ github.run_id }}\` attempt \`${{ github.run_attempt }}\`"
            echo "- GitHub run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Upload state: \`draft\`"
            echo "- Next step: inspect native results, complete operator readiness and Play-delivered verification, review translations, then publish manually."
          } >> "${GITHUB_STEP_SUMMARY}"

  publish_wear_android:
    name: Upload Wear OS bundle to Google Play Wear OS production draft release
    # After the phone publisher, so the two Play edits never overlap.
    needs:
      - preflight
      - build_signed_android
      - publish_android
    if: ${{ !cancelled() && needs.publish_android.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: android-release-publish-main
      cancel-in-progress: false
    env:
      ANDROID_VERSION_CODE: ${{ needs.preflight.outputs.android_wear_version_code }}
      ANDROID_PLAY_RELEASE_NAME: ${{ needs.preflight.outputs.android_wear_play_release_name }}

    steps:
      - name: Check out publisher tooling from the workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/android/publish-play-draft.py
            scripts/android/play_release_notes.py
          sparse-checkout-cone-mode: false

      - name: Download signed Wear OS App Bundle for this attempt
        uses: actions/download-artifact@v8
        with:
          name: android-wear-release-bundle-r${{ github.run_id }}a${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-wear-release-bundle

      - name: Authenticate to Google Play
        uses: google-github-actions/auth@v3
        id: auth
        with:
          create_credentials_file: false
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Upload Wear OS bundle to Google Play Wear OS production track as draft release
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          AAB_PATH: ${{ runner.temp }}/android-wear-release-bundle/wear-release.aab
          AAB_SHA256: ${{ needs.build_signed_android.outputs.wear_aab_sha256 }}
          ANDROID_PLAY_PACKAGE_NAME: ${{ vars.ANDROID_PLAY_PACKAGE_NAME }}
          ANDROID_PLAY_TRACK: 'wear:production'
          ARTIFACT_SOURCE_SHA: ${{ needs.preflight.outputs.target_sha }}
          PLAY_PROVENANCE_PATH: ${{ runner.temp }}/play-wear-publisher-provenance.json
        run: python3 .release-tools/scripts/android/publish-play-draft.py

      - name: Retain Wear OS Play publisher correlation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-wear-play-publisher-provenance
          if-no-files-found: ignore
          path: ${{ runner.temp }}/play-wear-publisher-provenance.json

      - name: Summarize Wear OS Play draft upload
        run: |
          {
            echo "## Wear OS Play draft upload"
            echo ""
            echo "- Track: \`wear:production\`"
            echo "- Release name: \`${ANDROID_PLAY_RELEASE_NAME}\`"
            echo "- Version code: \`${ANDROID_VERSION_CODE}\`"
            echo "- Target SHA: \`${{ needs.preflight.outputs.target_sha }}\`"
            echo "- GitHub run: \`${{ github.run_id }}\` attempt \`${{ github.run_attempt }}\`"
            echo "- Upload state: \`draft\`"
            echo "- Next step: publish it in Play Console together with the phone draft of this run."
          } >> "${GITHUB_STEP_SUMMARY}"

  release_summary:
    name: Android release summary
    if: ${{ always() }}
    needs:
      - preflight
      - android_ci
      - device_run_submission
      - build_signed_android
      - publish_android
      - publish_wear_android
    runs-on: ubuntu-24.04

    steps:
      - name: Summarize Android release outcome
        run: |
          {
            echo "## Android release summary"
            echo ""
            echo "- Target SHA: \`${{ needs.preflight.outputs.target_sha }}\`"
            echo "- Version code: \`${{ needs.preflight.outputs.android_version_code || 'n/a' }}\`"
            echo "- Release ID: \`${{ needs.preflight.outputs.android_release_id || 'n/a' }}\`"
            echo "- Play release name: \`${{ needs.preflight.outputs.android_play_release_name || 'n/a' }}\`"
            echo "- Android CI result: \`${{ needs.android_ci.result }}\`"
            echo "- Device Run terminal gate result: \`${{ needs.device_run_submission.result }}\`"
            echo "- Signed bundle and R8 gate result: \`${{ needs.build_signed_android.result }}\`"
            echo "- Play draft upload requested: \`true\`"
            echo "- Android Play draft upload result: \`${{ needs.publish_android.result }}\`"
            echo "- Wear OS version code: \`${{ needs.preflight.outputs.android_wear_version_code || 'n/a' }}\`"
            echo "- Wear OS Play release name: \`${{ needs.preflight.outputs.android_wear_play_release_name || 'n/a' }}\`"
            echo "- Wear OS Play draft upload result: \`${{ needs.publish_wear_android.result }}\`"
            echo "- Device Run named results and private evidence references: \`android-device-run-submissions\`"
            echo "- Play publish mode: \`CI uploads phone and Wear OS production-track drafts; Play Console publication remains manual\`"
            echo "- Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "${GITHUB_STEP_SUMMARY}"
