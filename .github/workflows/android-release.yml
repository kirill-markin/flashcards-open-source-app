name: Android Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Git SHA to release. Leave empty to release the selected workflow ref.
        required: false
        type: string
      localized_release_notes:
        description: Optional JSON list of {language,text} records using exact Google Play locale codes
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    name: Resolve Android release target
    runs-on: ubuntu-24.04
    outputs:
      play_notes_sha256: ${{ steps.release-notes.outputs.sha256 }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      android_version_code: ${{ steps.release-metadata.outputs.android_version_code }}
      android_version_name: ${{ steps.release-metadata.outputs.android_version_name }}
      android_target_short_sha: ${{ steps.release-metadata.outputs.android_target_short_sha }}
      android_release_id: ${{ steps.release-metadata.outputs.android_release_id }}
      android_play_release_name: ${{ steps.release-metadata.outputs.android_play_release_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve release target
        id: resolve
        env:
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          WORKFLOW_TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          target_sha="${INPUT_TARGET_SHA}"

          if [[ -z "${target_sha}" ]]; then
            target_sha="${WORKFLOW_TARGET_SHA}"
          fi

          target_sha="$(git rev-parse "${target_sha}")"

          {
            echo "target_sha=${target_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve Android release metadata
        id: release-metadata
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          base_epoch_seconds=1767225600
          current_epoch_seconds="$(date -u +%s)"
          version_code=$(( current_epoch_seconds - base_epoch_seconds ))
          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' apps/android/app/build.gradle.kts | head -n 1)"
          target_short_sha="$(printf '%s' "${TARGET_SHA}" | cut -c1-8)"
          release_id="vc${version_code}-r${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}-s${target_short_sha}"
          play_release_name="main-draft-${release_id}"

          if [[ "${version_code}" -le 0 ]]; then
            echo "Resolved Android version code must be positive. Got: ${version_code}." >&2
            exit 1
          fi

          if [[ "${version_code}" -gt 2100000000 ]]; then
            echo "Resolved Android version code exceeds Google Play limit. Got: ${version_code}." >&2
            exit 1
          fi

          if [[ -z "${version_name}" ]]; then
            echo "Could not resolve Android versionName from apps/android/app/build.gradle.kts." >&2
            exit 1
          fi

          if [[ "${#target_short_sha}" -ne 8 ]]; then
            echo "Resolved target SHA prefix must be 8 characters. Got: ${target_short_sha}." >&2
            exit 1
          fi

          {
            echo "android_version_code=${version_code}"
            echo "android_version_name=${version_name}"
            echo "android_target_short_sha=${target_short_sha}"
            echo "android_release_id=${release_id}"
            echo "android_play_release_name=${play_release_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out release-notes tooling from the workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts/android/play_release_notes.py
          sparse-checkout-cone-mode: false

      - name: Prepare localized Play release notes
        id: release-notes
        env:
          LOCALIZED_RELEASE_NOTES: ${{ inputs.localized_release_notes }}
          ARTIFACT_SOURCE_SHA: ${{ steps.resolve.outputs.target_sha }}
          ANDROID_VERSION_CODE: ${{ steps.release-metadata.outputs.android_version_code }}
          ANDROID_VERSION_NAME: ${{ steps.release-metadata.outputs.android_version_name }}
          PLAY_NOTES_PATH: ${{ runner.temp }}/release-notes.json
        run: python3 .release-tools/scripts/android/play_release_notes.py

      - name: Retain original Play release notes
        uses: actions/upload-artifact@v7
        with:
          name: android-release-notes-r${{ github.run_id }}a${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/release-notes.json

      - name: Summarize preflight
        run: |
          {
            echo "## Android release preflight"
            echo ""
            echo "- Target SHA: \`${{ steps.resolve.outputs.target_sha }}\`"
            echo "- Version code: \`${{ steps.release-metadata.outputs.android_version_code }}\`"
            echo "- Version name: \`${{ steps.release-metadata.outputs.android_version_name }}\`"
            echo "- Release ID: \`${{ steps.release-metadata.outputs.android_release_id }}\`"
            echo "- Play release name: \`${{ steps.release-metadata.outputs.android_play_release_name }}\`"
            echo "- Upload draft to Play: \`true\`"
            echo "- Run Device Run: \`true\`"
            echo "- Play publish mode: \`draft production release uploaded by CI; final publish happens later in Play Console\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  android_ci:
    name: Android CI
    needs:
      - preflight
    concurrency:
      group: android-release-ci-main
      cancel-in-progress: true
    uses: ./.github/workflows/android-ci-reusable.yml
    with:
      target_ref: ${{ needs.preflight.outputs.target_sha }}
      android_version_code: ${{ needs.preflight.outputs.android_version_code }}
    secrets: inherit

  device_run_submission:
    name: Device Run app instrumentation
    needs:
      - preflight
      - android_ci
    if: ${{ needs.android_ci.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    concurrency:
      group: android-release-device-run-shared-account
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      submission_state: ${{ steps.collect.outputs.submission_state }}
      session_id: ${{ steps.collect.outputs.session_id }}
      results_path: ${{ steps.collect.outputs.results_path }}
      device_descriptor: ${{ steps.collect.outputs.device_descriptor }}
      session_link: ${{ steps.collect.outputs.session_link }}
      compat_submission_state: ${{ steps.collect.outputs.compat_submission_state }}
      compat_sessions: ${{ steps.collect.outputs.compat_sessions }}
      compat_device_descriptors: ${{ steps.collect.outputs.compat_device_descriptors }}
      compat_test_targets: ${{ steps.collect.outputs.compat_test_targets }}

    steps:
      - name: Validate Device Run configuration
        id: validate-config
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          ANDROID_DEVICE_RUN_DEVICE: ${{ vars.ANDROID_DEVICE_RUN_DEVICE }}
          ANDROID_DEVICE_RUN_COMPAT_DEVICES: ${{ vars.ANDROID_DEVICE_RUN_COMPAT_DEVICES }}
          ANDROID_DEVICE_RUN_RESULTS_BUCKET: ${{ vars.ANDROID_DEVICE_RUN_RESULTS_BUCKET }}
        run: |
          set -euo pipefail
          missing_values=()
          for variable_name in \
            GCP_PROJECT_ID \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_SERVICE_ACCOUNT_EMAIL \
            ANDROID_DEVICE_RUN_DEVICE \
            ANDROID_DEVICE_RUN_COMPAT_DEVICES \
            ANDROID_DEVICE_RUN_RESULTS_BUCKET; do
            if [[ -z "${!variable_name}" ]]; then
              missing_values+=("${variable_name}")
            fi
          done

          configuration_invalid="false"
          if [[ ! "${ANDROID_DEVICE_RUN_DEVICE}" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "ANDROID_DEVICE_RUN_DEVICE must be a Device Run catalog ID for API 37." >&2
            configuration_invalid="true"
          fi
          if [[ ! "${ANDROID_DEVICE_RUN_RESULTS_BUCKET}" =~ ^[a-z0-9][a-z0-9._-]+$ ]]; then
            echo "ANDROID_DEVICE_RUN_RESULTS_BUCKET must be a bucket name without gs:// or a path." >&2
            configuration_invalid="true"
          fi
          compat_device_descriptors=""
          if ! jq -e '
            type == "array" and length == 3 and
            all(.[]; type == "string" and test("^[A-Za-z0-9_-]+$")) and
            (unique | length == 3)
          ' <<< "${ANDROID_DEVICE_RUN_COMPAT_DEVICES}" >/dev/null; then
            echo "ANDROID_DEVICE_RUN_COMPAT_DEVICES must be three distinct catalog IDs, ordered by API 30, 31, 33." >&2
            configuration_invalid="true"
          else
            compat_device_descriptors="$(jq -r 'join("; ")' <<< "${ANDROID_DEVICE_RUN_COMPAT_DEVICES}")"
            jq -c '
              to_entries | map({
                device: .value, api: (["30", "31", "33"][.key]),
                session_id: "", results_path: "", session_link: "", outcome: "not_executed"
              })
            ' <<< "${ANDROID_DEVICE_RUN_COMPAT_DEVICES}" > "${RUNNER_TEMP}/device-run-compat-sessions.json"
          fi

          if [[ "${#missing_values[@]}" -gt 0 || "${configuration_invalid}" == "true" ]]; then
            printf 'Missing required GitHub Actions variables for Android app instrumentation: %s\n' "${missing_values[*]}" >&2
            echo "Configure them with bash scripts/android/setup-github-android.sh or in the GitHub repository settings." >&2
            echo "submission_state=configuration_invalid" >> "${GITHUB_OUTPUT}"
          else
            echo "submission_state=ready" >> "${GITHUB_OUTPUT}"
          fi
          {
            echo "device_descriptor=${ANDROID_DEVICE_RUN_DEVICE}"
            echo "compat_device_descriptors=${compat_device_descriptors}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7
        if: ${{ steps.validate-config.outputs.submission_state == 'ready' }}
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}

      - uses: google-github-actions/auth@v3
        id: auth
        if: ${{ steps.validate-config.outputs.submission_state == 'ready' }}
        continue-on-error: true
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v3
        id: setup-gcloud
        if: ${{ steps.validate-config.outputs.submission_state == 'ready' && steps.auth.outcome == 'success' }}
        continue-on-error: true
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          version: '588.0.0'
          install_components: beta

      - name: Require configured Device Run destinations in the current catalog
        id: device-catalog
        if: ${{ steps.validate-config.outputs.submission_state == 'ready' && steps.auth.outcome == 'success' && steps.setup-gcloud.outcome == 'success' }}
        continue-on-error: true
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ANDROID_DEVICE_RUN_DEVICE: ${{ vars.ANDROID_DEVICE_RUN_DEVICE }}
          ANDROID_DEVICE_RUN_COMPAT_DEVICES: ${{ vars.ANDROID_DEVICE_RUN_COMPAT_DEVICES }}
        run: |
          set -euo pipefail
          catalog_path="${RUNNER_TEMP}/device-run-catalog.json"
          gcloud beta device-run devices list --project "${GCP_PROJECT_ID}" --location global --format=json > "${catalog_path}"
          destinations="$(jq -c --arg latest "${ANDROID_DEVICE_RUN_DEVICE}" '
            [{device: $latest, api: "37"}, {device: .[0], api: "30"}, {device: .[1], api: "31"}, {device: .[2], api: "33"}]
          ' <<< "${ANDROID_DEVICE_RUN_COMPAT_DEVICES}")"
          while IFS=$'\t' read -r device api; do
            if ! jq -e --arg device "${device}" --arg api "${api}" '
              any(.[];
                (.name | split("/") | last) == $device and .osVersion == $api and
                .platform == "ANDROID" and .lifecycle.state == "ACTIVE" and
                ((.accessDeniedReasons // []) | length == 0) and
                any(.supportedProducts[]; .automation != null))
            ' "${catalog_path}" >/dev/null; then
              echo "Device Run destination ${device} must be an active, accessible Android automation device on API ${api}. Inspect gcloud beta device-run devices list --location global; all API 30/31/33/37 destinations are required." >&2
              exit 1
            fi
          done < <(jq -r '.[] | [.device, .api] | @tsv' <<< "${destinations}")

      - name: Download debug APKs
        id: download-debug-apks
        if: ${{ steps.validate-config.outputs.submission_state == 'ready' && steps.auth.outcome == 'success' && steps.setup-gcloud.outcome == 'success' && steps.device-catalog.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: android-debug-apks
          path: /tmp/android-debug-apks

      - name: Resolve debug APK paths
        id: resolve-debug-apks
        if: ${{ steps.validate-config.outputs.submission_state == 'ready' && steps.auth.outcome == 'success' && steps.setup-gcloud.outcome == 'success' && steps.device-catalog.outcome == 'success' && steps.download-debug-apks.outcome == 'success' }}
        continue-on-error: true
        run: |
          app_apk_path="$(find /tmp/android-debug-apks -type f -name 'app-debug.apk' | head -n 1)"
          test_apk_path="$(find /tmp/android-debug-apks -type f -name 'app-debug-androidTest.apk' | head -n 1)"

          if [[ -z "${app_apk_path}" ]]; then
            echo "App APK not found in downloaded artifact." >&2
            find /tmp/android-debug-apks -maxdepth 5 -type f >&2
            exit 1
          fi

          if [[ -z "${test_apk_path}" ]]; then
            echo "Android test APK not found in downloaded artifact." >&2
            find /tmp/android-debug-apks -maxdepth 5 -type f >&2
            exit 1
          fi

          printf 'APP_APK_PATH=%s\n' "${app_apk_path}" >> "${GITHUB_ENV}"
          printf 'TEST_APK_PATH=%s\n' "${test_apk_path}" >> "${GITHUB_ENV}"

      - name: Run latest app instrumentation to terminal success
        id: submit
        if: ${{ steps.validate-config.outputs.submission_state == 'ready' && steps.auth.outcome == 'success' && steps.setup-gcloud.outcome == 'success' && steps.device-catalog.outcome == 'success' && steps.download-debug-apks.outcome == 'success' && steps.resolve-debug-apks.outcome == 'success' }}
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ANDROID_DEVICE_RUN_DEVICE: ${{ vars.ANDROID_DEVICE_RUN_DEVICE }}
          ANDROID_DEVICE_RUN_RESULTS_BUCKET: ${{ vars.ANDROID_DEVICE_RUN_RESULTS_BUCKET }}
          RELEASE_ID: ${{ needs.preflight.outputs.android_release_id }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
        run: |
          set -euo pipefail
          command_output_file="${RUNNER_TEMP}/device-run-latest-submit.log"
          session_output="${RUNNER_TEMP}/device-run-latest-session.json"
          device_args=(--device "${ANDROID_DEVICE_RUN_DEVICE}")
          mapfile -t test_targets < <(jq -r '.latest[]' scripts/android/device-run-test-selection.json)
          test_target_args=()
          for test_target in "${test_targets[@]}"; do
            test_target_args+=(--test-targets "${test_target}")
          done

          set +e
          bash scripts/android/run-android-device-run.sh \
            --project-id "${GCP_PROJECT_ID}" \
            "${device_args[@]}" \
            --app-path "${APP_APK_PATH}" \
            --test-path "${TEST_APK_PATH}" \
            --timeout "30m" \
            "${test_target_args[@]}" \
            --results-bucket "${ANDROID_DEVICE_RUN_RESULTS_BUCKET}" \
            --labels "release_id=${RELEASE_ID},target_sha=${TARGET_SHA},github_run_id=${GITHUB_RUN_ID},github_run_attempt=${GITHUB_RUN_ATTEMPT},suite=latest" \
            --session-output "${session_output}" \
            --max-session-duration "35m" > "${command_output_file}" 2>&1
          command_exit_code=$?
          set -e
          echo "Device Run submission completed with exit ${command_exit_code}; raw diagnostics are retained privately."

          session_id="$(sed -nE 's/.*Creating session \[(session-[a-f0-9-]+)\] in location \[global\].*/\1/p' "${command_output_file}")"
          results_path=""
          session_link=""
          if [[ -n "${session_id}" ]]; then
            results_path="gs://${ANDROID_DEVICE_RUN_RESULTS_BUCKET}/automation/sessions/${session_id}/"
            session_link="https://console.cloud.google.com/storage/browser/${results_path#gs://}?project=${GCP_PROJECT_ID}"
          fi
          if [[ "${command_exit_code}" -eq 0 ]]; then
            session_id="$(jq -r '.name | split("/") | last' "${session_output}")"
            results_path="$(jq -r '.sessionConfig.outputDirectoryConfig.gcsOutputDirectory.path' "${session_output}")/${session_id}/"
            session_link="https://console.cloud.google.com/storage/browser/${results_path#gs://}?project=${GCP_PROJECT_ID}"
            submission_state="passed"
          else
            submission_state="failed"
            echo "Device Run latest session failed. Exit=${command_exit_code} Release=${RELEASE_ID} Session=${session_id:-not_created}. Inspect ${command_output_file} and ${session_output}." >&2
          fi
          {
            echo "submission_state=${submission_state}"
            echo "session_id=${session_id}"
            echo "session_link=${session_link}"
            echo "results_path=${results_path}"
            echo "test_targets=${test_targets[*]}"
          } >> "${GITHUB_OUTPUT}"
          exit "${command_exit_code}"

      - name: Run API 30/31/33 compatibility smoke sequentially
        id: submit-compat
        if: ${{ success() && steps.submit.outputs.submission_state == 'passed' }}
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ANDROID_DEVICE_RUN_RESULTS_BUCKET: ${{ vars.ANDROID_DEVICE_RUN_RESULTS_BUCKET }}
          RELEASE_ID: ${{ needs.preflight.outputs.android_release_id }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
        run: |
          set -euo pipefail
          sessions_file="${RUNNER_TEMP}/device-run-compat-sessions.json"
          mapfile -t test_targets < <(jq -r '.compat[]' scripts/android/device-run-test-selection.json)
          test_target_args=()
          for test_target in "${test_targets[@]}"; do
            test_target_args+=(--test-targets "${test_target}")
          done
          echo "test_targets=${test_targets[*]}" >> "${GITHUB_OUTPUT}"

          while IFS=$'\t' read -r device api; do
            command_output_file="${RUNNER_TEMP}/device-run-compat-api${api}-submit.log"
            session_output="${RUNNER_TEMP}/device-run-compat-api${api}-session.json"
            jq -c --arg device "${device}" '
              map(if .device == $device then .outcome = "running" else . end)
            ' "${sessions_file}" > "${sessions_file}.tmp"
            mv "${sessions_file}.tmp" "${sessions_file}"

            set +e
            bash scripts/android/run-android-device-run.sh \
              --project-id "${GCP_PROJECT_ID}" \
              --device "${device}" \
              --app-path "${APP_APK_PATH}" \
              --test-path "${TEST_APK_PATH}" \
              --timeout "30m" \
              --max-session-duration "35m" \
              "${test_target_args[@]}" \
              --results-bucket "${ANDROID_DEVICE_RUN_RESULTS_BUCKET}" \
              --labels "release_id=${RELEASE_ID},target_sha=${TARGET_SHA},github_run_id=${GITHUB_RUN_ID},github_run_attempt=${GITHUB_RUN_ATTEMPT},suite=compat" \
              --session-output "${session_output}" > "${command_output_file}" 2>&1
            command_exit_code=$?
            set -e
            echo "Device Run submission completed with exit ${command_exit_code}; raw diagnostics are retained privately."

            session_id="$(sed -nE 's/.*Creating session \[(session-[a-f0-9-]+)\] in location \[global\].*/\1/p' "${command_output_file}")"
            results_path=""
            session_link=""
            if [[ -n "${session_id}" ]]; then
              results_path="gs://${ANDROID_DEVICE_RUN_RESULTS_BUCKET}/automation/sessions/${session_id}/"
              session_link="https://console.cloud.google.com/storage/browser/${results_path#gs://}?project=${GCP_PROJECT_ID}"
            fi
            outcome="failed"
            if [[ "${command_exit_code}" -eq 0 ]]; then
              session_id="$(jq -r '.name | split("/") | last' "${session_output}")"
              results_path="$(jq -r '.sessionConfig.outputDirectoryConfig.gcsOutputDirectory.path' "${session_output}")/${session_id}/"
              session_link="https://console.cloud.google.com/storage/browser/${results_path#gs://}?project=${GCP_PROJECT_ID}"
              outcome="passed"
            fi
            jq -c --arg device "${device}" --arg session_id "${session_id}" \
              --arg results_path "${results_path}" --arg session_link "${session_link}" --arg outcome "${outcome}" '
              map(if .device == $device then
                . + {session_id: $session_id, results_path: $results_path, session_link: $session_link, outcome: $outcome}
              else . end)
            ' "${sessions_file}" > "${sessions_file}.tmp"
            mv "${sessions_file}.tmp" "${sessions_file}"
            if [[ "${command_exit_code}" -ne 0 ]]; then
              echo "Device Run compatibility failed. Device=${device} API=${api} Session=${session_id:-not_created} Exit=${command_exit_code}. Later destinations remain not_executed." >&2
              exit "${command_exit_code}"
            fi
          done < <(jq -r '.[] | [.device, .api] | @tsv' "${sessions_file}")

      - name: Collect Device Run outcome
        if: always()
        id: collect
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ANDROID_DEVICE_RUN_RESULTS_BUCKET: ${{ vars.ANDROID_DEVICE_RUN_RESULTS_BUCKET }}
          VALIDATION_STATE: ${{ steps.validate-config.outputs.submission_state }}
          AUTH_STEP_OUTCOME: ${{ steps.auth.outcome }}
          GCLOUD_STEP_OUTCOME: ${{ steps.setup-gcloud.outcome }}
          CATALOG_STEP_OUTCOME: ${{ steps.device-catalog.outcome }}
          DOWNLOAD_STEP_OUTCOME: ${{ steps.download-debug-apks.outcome }}
          RESOLVE_STEP_OUTCOME: ${{ steps.resolve-debug-apks.outcome }}
          SUBMIT_STATE: ${{ steps.submit.outputs.submission_state }}
          SUBMIT_SESSION_ID: ${{ steps.submit.outputs.session_id }}
          SUBMIT_SESSION_LINK: ${{ steps.submit.outputs.session_link }}
          COMPAT_TEST_TARGETS: ${{ steps.submit-compat.outputs.test_targets }}
          COMPAT_DEVICE_DESCRIPTORS: ${{ steps.validate-config.outputs.compat_device_descriptors }}
          RESULTS_PATH: ${{ steps.submit.outputs.results_path }}
          DEVICE_DESCRIPTOR: ${{ steps.validate-config.outputs.device_descriptor }}
        run: |
          set -euo pipefail

          submission_state="${VALIDATION_STATE}"
          session_id="${SUBMIT_SESSION_ID}"
          results_path="${RESULTS_PATH}"
          session_link="${SUBMIT_SESSION_LINK}"
          if [[ -z "${session_id}" && -f "${RUNNER_TEMP}/device-run-latest-submit.log" ]]; then
            session_id="$(sed -nE 's/.*Creating session \[(session-[a-f0-9-]+)\] in location \[global\].*/\1/p' "${RUNNER_TEMP}/device-run-latest-submit.log")"
            if [[ -n "${session_id}" ]]; then
              results_path="gs://${ANDROID_DEVICE_RUN_RESULTS_BUCKET}/automation/sessions/${session_id}/"
              session_link="https://console.cloud.google.com/storage/browser/${results_path#gs://}?project=${GCP_PROJECT_ID}"
            fi
          fi

          if [[ "${VALIDATION_STATE}" == "ready" ]]; then
            if [[ "${AUTH_STEP_OUTCOME}" != "success" ]]; then
              submission_state="auth_failed"
            elif [[ "${GCLOUD_STEP_OUTCOME}" != "success" ]]; then
              submission_state="setup_failed"
            elif [[ "${CATALOG_STEP_OUTCOME}" != "success" ]]; then
              submission_state="device_catalog_invalid"
            elif [[ "${DOWNLOAD_STEP_OUTCOME}" != "success" ]]; then
              submission_state="artifact_download_failed"
            elif [[ "${RESOLVE_STEP_OUTCOME}" != "success" ]]; then
              submission_state="artifact_resolution_failed"
            elif [[ -n "${SUBMIT_STATE}" ]]; then
              submission_state="${SUBMIT_STATE}"
            else
              submission_state="submission_failed"
            fi
          fi

          if [[ "${submission_state}" == "passed" && -z "${session_id}" ]]; then
            submission_state="failed"
          fi
          compat_sessions="[]"
          compat_submission_state="not_executed"
          if [[ -f "${RUNNER_TEMP}/device-run-compat-sessions.json" ]]; then
            sessions_file="${RUNNER_TEMP}/device-run-compat-sessions.json"
            while IFS=$'\t' read -r device api; do
              log_path="${RUNNER_TEMP}/device-run-compat-api${api}-submit.log"
              interrupted_session_id=""
              if [[ -f "${log_path}" ]]; then
                interrupted_session_id="$(sed -nE 's/.*Creating session \[(session-[a-f0-9-]+)\] in location \[global\].*/\1/p' "${log_path}")"
              fi
              interrupted_results=""
              interrupted_link=""
              if [[ -n "${interrupted_session_id}" ]]; then
                interrupted_results="gs://${ANDROID_DEVICE_RUN_RESULTS_BUCKET}/automation/sessions/${interrupted_session_id}/"
                interrupted_link="https://console.cloud.google.com/storage/browser/${interrupted_results#gs://}?project=${GCP_PROJECT_ID}"
              fi
              jq -c --arg device "${device}" --arg session_id "${interrupted_session_id}" \
                --arg results_path "${interrupted_results}" --arg session_link "${interrupted_link}" '
                map(if .device == $device then
                  . + {session_id: $session_id, results_path: $results_path, session_link: $session_link, outcome: "interrupted"}
                else . end)
              ' "${sessions_file}" > "${sessions_file}.tmp"
              mv "${sessions_file}.tmp" "${sessions_file}"
            done < <(jq -r '.[] | select(.outcome == "running") | [.device, .api] | @tsv' "${sessions_file}")
            compat_sessions="$(cat "${sessions_file}")"
            if jq -e 'length == 3 and all(.[]; .outcome == "passed" and (.session_id | length > 0))' <<< "${compat_sessions}" >/dev/null; then
              compat_submission_state="passed"
            elif jq -e 'any(.[]; .outcome != "not_executed")' <<< "${compat_sessions}" >/dev/null; then
              compat_submission_state="failed"
            fi
          fi

          {
            echo "submission_state=${submission_state}"
            echo "session_id=${session_id}"
            echo "session_link=${session_link}"
            echo "compat_submission_state=${compat_submission_state}"
            echo "compat_test_targets=${COMPAT_TEST_TARGETS}"
            echo "compat_sessions=${compat_sessions}"
            echo "compat_device_descriptors=${COMPAT_DEVICE_DESCRIPTORS}"
            echo "results_path=${results_path}"
            echo "device_descriptor=${DEVICE_DESCRIPTOR}"
          } >> "${GITHUB_OUTPUT}"

      - name: Collect private native evidence and gate named results
        id: native-evidence
        if: ${{ always() && steps.resolve-debug-apks.outcome == 'success' }}
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ANDROID_DEVICE_RUN_RESULTS_BUCKET: ${{ vars.ANDROID_DEVICE_RUN_RESULTS_BUCKET }}
          ANDROID_DEVICE_RUN_DEVICE: ${{ vars.ANDROID_DEVICE_RUN_DEVICE }}
          ANDROID_DEVICE_RUN_COMPAT_DEVICES: ${{ vars.ANDROID_DEVICE_RUN_COMPAT_DEVICES }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          RELEASE_ID: ${{ needs.preflight.outputs.android_release_id }}
        run: python3 scripts/android/collect-device-run-evidence.py

      - name: Preserve public-safe Device Run named results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-run-submissions
          if-no-files-found: ignore
          path: ${{ runner.temp }}/device-run-public/summary.json

      - name: Summarize Device Run terminal results
        if: always()
        env:
          SUBMISSION_STATE: ${{ steps.collect.outputs.submission_state }}
          SESSION_ID: ${{ steps.collect.outputs.session_id }}
          SESSION_LINK: ${{ steps.collect.outputs.session_link }}
          COMPAT_SUBMISSION_STATE: ${{ steps.collect.outputs.compat_submission_state }}
          COMPAT_TEST_TARGETS: ${{ steps.collect.outputs.compat_test_targets }}
          COMPAT_SESSIONS: ${{ steps.collect.outputs.compat_sessions }}
          COMPAT_DEVICE_DESCRIPTORS: ${{ steps.collect.outputs.compat_device_descriptors }}
          RESULTS_PATH: ${{ steps.collect.outputs.results_path }}
          DEVICE_DESCRIPTOR: ${{ steps.collect.outputs.device_descriptor }}
          RELEASE_ID: ${{ needs.preflight.outputs.android_release_id }}
        run: |
          {
            echo "## Device Run terminal results"
            echo ""
            echo "- Latest outcome: \`${SUBMISSION_STATE}\`"
            echo "- Release ID: \`${RELEASE_ID}\`"
            echo "- Target SHA: \`${{ needs.preflight.outputs.target_sha }}\`"
            echo "- Session ID: \`${SESSION_ID:-n/a}\`"
            echo "- Results path: \`${RESULTS_PATH:-n/a}\`"
            echo "- Device: \`${DEVICE_DESCRIPTOR:-n/a}\`"
            echo "- Latest session lookup: ${SESSION_LINK:-n/a}"
            echo "- Latest targets: \`package com.flashcardsopensourceapp.app\` with notAnnotation com.flashcardsopensourceapp.app.ManualOnlyAndroidTest"
            echo "- Compatibility outcome: \`${COMPAT_SUBMISSION_STATE:-n/a}\`"
            echo ""
            echo "| API | Device | Outcome | Session / results | Results path |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '.[] | "| \(.api) | \(.device) | \(.outcome) | [\(.session_id)](\(.session_link)) | \(.results_path) |"' <<< "${COMPAT_SESSIONS}"
            echo ""
            echo "- Compatibility devices: \`${COMPAT_DEVICE_DESCRIPTORS:-n/a}\`"
            echo "- Compatibility targets: \`${COMPAT_TEST_TARGETS:-n/a}\`"
            echo "- Play draft upload requires four terminal PASSED sessions and complete reconciled native named results. Inspect the safe summary artifact; raw warning and diagnostic review remains operator-owned."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Require all four terminal Device Run successes
        if: always()
        env:
          SUBMISSION_STATE: ${{ steps.collect.outputs.submission_state }}
          COMPAT_SUBMISSION_STATE: ${{ steps.collect.outputs.compat_submission_state }}
        run: |
          set -euo pipefail

          if [[ "${SUBMISSION_STATE}" != "passed" || "${COMPAT_SUBMISSION_STATE}" != "passed" ]]; then
            echo "All four Device Run sessions must reach terminal success before the Play draft upload. Latest: ${SUBMISSION_STATE:-unknown}. Compatibility: ${COMPAT_SUBMISSION_STATE:-unknown}." >&2
            exit 1
          fi

  publish_android:
    name: Upload Android bundle to Google Play production draft release
    needs:
      - preflight
      - android_ci
      - device_run_submission
    if: ${{ needs.android_ci.result == 'success' && needs.device_run_submission.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: android-release-publish-main
      cancel-in-progress: false
    env:
      ANDROID_VERSION_CODE: ${{ needs.preflight.outputs.android_version_code }}
      ANDROID_VERSION_NAME: ${{ needs.preflight.outputs.android_version_name }}
      ANDROID_RELEASE_ID: ${{ needs.preflight.outputs.android_release_id }}
      ANDROID_PLAY_RELEASE_NAME: ${{ needs.preflight.outputs.android_play_release_name }}
      ANDROID_SENTRY_DSN: ${{ vars.ANDROID_SENTRY_DSN }}
      ANDROID_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.ANDROID_SENTRY_TRACES_SAMPLE_RATE || '0' }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_ANDROID_PROJECT: ${{ vars.SENTRY_ANDROID_PROJECT }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}

      - name: Validate Google Play configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_PLAY_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT_EMAIL }}
          ANDROID_PLAY_PACKAGE_NAME: ${{ vars.ANDROID_PLAY_PACKAGE_NAME }}
        run: |
          missing_values=()

          for variable_name in \
            GCP_PROJECT_ID \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_PLAY_SERVICE_ACCOUNT_EMAIL \
            ANDROID_PLAY_PACKAGE_NAME; do
            if [[ -z "${!variable_name}" ]]; then
              missing_values+=("${variable_name}")
            fi
          done

          if [[ "${#missing_values[@]}" -gt 0 ]]; then
            printf 'Missing required GitHub Actions variables: %s\n' "${missing_values[*]}" >&2
            echo "Configure them in the GitHub repository settings or with bash scripts/android/setup-github-android.sh." >&2
            exit 1
          fi

      - name: Validate Android Sentry configuration
        env:
          ANDROID_SENTRY_DSN: ${{ vars.ANDROID_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_ANDROID_PROJECT: ${{ vars.SENTRY_ANDROID_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          missing_values=()

          for variable_name in \
            ANDROID_SENTRY_DSN \
            SENTRY_ORG \
            SENTRY_ANDROID_PROJECT \
            SENTRY_AUTH_TOKEN; do
            if [[ -z "${!variable_name}" ]]; then
              missing_values+=("${variable_name}")
            fi
          done

          if [[ "${#missing_values[@]}" -gt 0 ]]; then
            printf 'Missing required Android Sentry release values: %s\n' "${missing_values[*]}" >&2
            echo "Configure repository variables/secrets or run bash scripts/android/setup-github-android.sh." >&2
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.4.0

      - uses: google-github-actions/auth@v3
        id: auth
        with:
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install Android SDK packages
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"

      - name: Validate Android signing secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing_secrets=()

          for secret_name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS \
            ANDROID_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              missing_secrets+=("${secret_name}")
            fi
          done

          if [[ "${#missing_secrets[@]}" -gt 0 ]]; then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing_secrets[*]}" >&2
            echo "Configure them in the GitHub repository settings or with bash scripts/android/setup-github-android.sh." >&2
            exit 1
          fi

      - name: Prepare Android upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          keystore_path="${RUNNER_TEMP}/android-upload-key.jks"
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"

          if [[ ! -s "${keystore_path}" ]]; then
            echo "Decoded Android upload keystore is empty." >&2
            exit 1
          fi

          printf 'ANDROID_KEYSTORE_PATH=%s\n' "${keystore_path}" >> "${GITHUB_ENV}"

      - name: Build signed Android App Bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          bash scripts/android/run-android-release.sh \
            --version-code "${ANDROID_VERSION_CODE}" \
            --keystore-path "${ANDROID_KEYSTORE_PATH}" \
            --keystore-password "${ANDROID_UPLOAD_KEYSTORE_PASSWORD}" \
            --key-alias "${ANDROID_UPLOAD_KEY_ALIAS}" \
            --key-password "${ANDROID_UPLOAD_KEY_PASSWORD}"

      - name: Upload signed Android App Bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-bundle
          if-no-files-found: error
          path: apps/android/app/build/outputs/bundle/release/app-release.aab

      - name: Report and gate R8 optimization coverage
        env:
          ANDROID_R8_MIN_COVERAGE_PERCENT: '25'
        run: |
          set -euo pipefail

          bundle_path="apps/android/app/build/outputs/bundle/release/app-release.aab"
          r8_metadata_path="${RUNNER_TEMP}/android-release-r8.json"

          if ! unzip -p "${bundle_path}" "BUNDLE-METADATA/com.android.tools/r8.json" > "${r8_metadata_path}"; then
            echo "BUNDLE-METADATA/com.android.tools/r8.json is missing from ${bundle_path}. R8 optimization coverage cannot be verified." >&2
            exit 1
          fi

          if [[ "$(jq -r 'try ((.stats.noShrinkingPercentage | numbers) != null) catch false' "${r8_metadata_path}")" != "true" ]]; then
            echo "R8 metadata in ${bundle_path} has no usable stats object." >&2
            cat "${r8_metadata_path}" >&2
            exit 1
          fi

          r8_version="$(jq -r '.version // "unknown"' "${r8_metadata_path}")"
          coverage_report="$(
            jq -r '
              .stats
              | [
                  ["Shrinking", ((100 - .noShrinkingPercentage) * 100 | round / 100)],
                  ["Optimization", ((100 - .noOptimizationPercentage) * 100 | round / 100)],
                  ["Obfuscation", ((100 - .noObfuscationPercentage) * 100 | round / 100)]
                ]
              | .[]
              | "\(.[0])\t\(.[1])"
            ' "${r8_metadata_path}"
          )"

          summary_lines=()
          failures=()

          while IFS=$'\t' read -r category coverage; do
            summary_lines+=("- ${category} coverage: \`${coverage}%\`")
            if ! awk -v value="${coverage}" -v minimum="${ANDROID_R8_MIN_COVERAGE_PERCENT}" 'BEGIN { exit !(value >= minimum) }'; then
              failures+=("${category} coverage ${coverage}% is below the required ${ANDROID_R8_MIN_COVERAGE_PERCENT}%")
            fi
          done <<< "${coverage_report}"

          {
            echo "## Android R8 optimization coverage"
            echo ""
            echo "- R8 version: \`${r8_version}\`"
            echo "- Google Play minimum per category: \`${ANDROID_R8_MIN_COVERAGE_PERCENT}%\`"
            printf '%s\n' "${summary_lines[@]}"
          } >> "${GITHUB_STEP_SUMMARY}"

          printf '%s\n' "${summary_lines[@]}"

          if [[ "${#failures[@]}" -gt 0 ]]; then
            printf 'R8 optimization coverage gate failed: %s\n' "${failures[*]}" >&2
            exit 1
          fi

      - name: Check out publisher tooling from the workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/android/publish-play-draft.py
            scripts/android/play_release_notes.py
          sparse-checkout-cone-mode: false

      - name: Download original Play release notes
        uses: actions/download-artifact@v8
        with:
          name: android-release-notes-r${{ github.run_id }}a${{ github.run_attempt }}
          path: ${{ runner.temp }}/play-release-notes

      - name: Upload bundle to Google Play production track as draft release
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ANDROID_PLAY_PACKAGE_NAME: ${{ vars.ANDROID_PLAY_PACKAGE_NAME }}
          ARTIFACT_SOURCE_SHA: ${{ needs.preflight.outputs.target_sha }}
          PLAY_PROVENANCE_PATH: ${{ runner.temp }}/play-publisher-provenance.json
          PLAY_NOTES_PATH: ${{ runner.temp }}/play-release-notes/release-notes.json
          PLAY_NOTES_SHA256: ${{ needs.preflight.outputs.play_notes_sha256 }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          export AAB_PATH="apps/android/app/build/outputs/bundle/release/app-release.aab"
          AAB_SHA256="$(sha256sum "${AAB_PATH}" | cut -d ' ' -f 1)"
          export AAB_SHA256
          python3 .release-tools/scripts/android/publish-play-draft.py

      - name: Retain Play publisher correlation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-play-publisher-provenance
          if-no-files-found: ignore
          path: ${{ runner.temp }}/play-publisher-provenance.json

      - name: Summarize Play draft upload
        run: |
          {
            echo "## Android Play draft upload"
            echo ""
            echo "- Release ID: \`${ANDROID_RELEASE_ID}\`"
            echo "- Production track release name: \`${ANDROID_PLAY_RELEASE_NAME}\`"
            echo "- Sentry release: \`com.flashcardsopensourceapp.app@${ANDROID_VERSION_NAME}+${ANDROID_VERSION_CODE}\`"
            echo "- Version code: \`${ANDROID_VERSION_CODE}\`"
            echo "- Version name: \`${ANDROID_VERSION_NAME}\`"
            echo "- Target SHA: \`${{ needs.preflight.outputs.target_sha }}\`"
            echo "- GitHub run: \`${{ github.run_id }}\` attempt \`${{ github.run_attempt }}\`"
            echo "- GitHub run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Upload state: \`draft\`"
            echo "- Device Run: \`four terminal passing sessions in this Android Release run\`"
            echo "- Next step: inspect every session's named test results, review Play App strings translations in Play Console, then publish manually."
          } >> "${GITHUB_STEP_SUMMARY}"

  release_summary:
    name: Android release summary
    if: ${{ always() }}
    needs:
      - preflight
      - android_ci
      - device_run_submission
      - publish_android
    runs-on: ubuntu-24.04

    steps:
      - name: Summarize Android release outcome
        env:
          COMPAT_SESSIONS: ${{ needs.device_run_submission.outputs.compat_sessions }}
        run: |
          {
            echo "## Android release summary"
            echo ""
            echo "- Target SHA: \`${{ needs.preflight.outputs.target_sha }}\`"
            echo "- Version code: \`${{ needs.preflight.outputs.android_version_code || 'n/a' }}\`"
            echo "- Release ID: \`${{ needs.preflight.outputs.android_release_id || 'n/a' }}\`"
            echo "- Play release name: \`${{ needs.preflight.outputs.android_play_release_name || 'n/a' }}\`"
            echo "- Android CI result: \`${{ needs.android_ci.result }}\`"
            echo "- Device Run terminal gate result: \`${{ needs.device_run_submission.result }}\`"
            echo "- Device Run requested: \`true\`"
            echo "- Play draft upload requested: \`true\`"
            echo "- Android Play draft upload result: \`${{ needs.publish_android.result }}\`"
            echo "- Latest Device Run outcome: \`${{ needs.device_run_submission.outputs.submission_state || 'n/a' }}\`"
            echo "- Device Run session ID: \`${{ needs.device_run_submission.outputs.session_id || 'n/a' }}\`"
            echo "- Device Run results path: \`${{ needs.device_run_submission.outputs.results_path || 'n/a' }}\`"
            echo "- Device Run device: \`${{ needs.device_run_submission.outputs.device_descriptor || 'n/a' }}\`"
            echo "- Latest session lookup: ${{ needs.device_run_submission.outputs.session_link || 'n/a' }}"
            echo "- Latest targets: \`package com.flashcardsopensourceapp.app\` with notAnnotation com.flashcardsopensourceapp.app.ManualOnlyAndroidTest"
            echo "- Compatibility outcome: \`${{ needs.device_run_submission.outputs.compat_submission_state || 'n/a' }}\`"
            echo ""
            echo "| API | Device | Outcome | Session / results | Results path |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '.[] | "| \(.api) | \(.device) | \(.outcome) | [\(.session_id)](\(.session_link)) | \(.results_path) |"' <<< "${COMPAT_SESSIONS:-[]}"
            echo ""
            echo "- Compatibility devices: \`${{ needs.device_run_submission.outputs.compat_device_descriptors || 'n/a' }}\`"
            echo "- Compatibility targets: \`${{ needs.device_run_submission.outputs.compat_test_targets || 'n/a' }}\`"
            echo "- Play draft upload requires four terminal PASSED sessions and complete reconciled native named results. Inspect the safe summary artifact; raw warning and diagnostic review remains operator-owned."
            echo "- Play publish mode: \`CI uploads a production-track draft only; Play Console publication remains manual\`"
            echo "- Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "${GITHUB_STEP_SUMMARY}"
