name: GeoLite Country Refresh

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: geolite-refresh
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  STACK_NAME: FlashcardsOpenSourceApp

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix apps/backend
      - name: Resolve restricted refresh role
        id: role
        env:
          DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          echo "arn=${DEPLOY_ROLE_ARN%:role/*}:role/flashcards-open-source-app-geolite-refresh" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Refresh private Country database
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: bash scripts/geolite/refresh-country.sh
