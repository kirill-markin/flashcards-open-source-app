name: AWS/Web Release

on:
  push:
    branches: [main]
    paths:
      - 'apps/auth/**'
      - 'apps/backend/**'
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'db/**'
      - 'infra/**'
      - 'scripts/checks/check-agent-api-smoke.sh'
      - 'scripts/checks/check-api-health.sh'
      - 'scripts/checks/check-demo-cognito-users.sh'
      - 'scripts/checks/check-multipart-completion-reconciliation-schedule.sh'
      - 'scripts/checks/check-mcp-smoke.sh'
      - 'scripts/checks/check-public-endpoints.sh'
      - 'scripts/deploy/deploy-admin.sh'
      - 'scripts/deploy/deploy-web.sh'
      - 'scripts/deploy/select-release-components.sh'
      - 'scripts/deploy/prepare-monitoring-refactor.py'
      - 'scripts/deploy/migrate-monitoring-stack.py'
      - 'scripts/deploy/report-cloudformation-budget.py'
      - 'scripts/generate/generate-catalog-dump.sh'
      - 'scripts/generate/generate-global-metrics-snapshot.sh'
      - 'scripts/deploy/migrate-aws.sh'
      - 'scripts/generate/write-ci-cdk-context.py'
      - 'scripts/geolite/**'
      - '.github/workflows/aws-web-release.yml'
  workflow_dispatch:

concurrency:
  group: main-release
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  STACK_NAME: FlashcardsOpenSourceApp

jobs:
  changes:
    name: Select release components
    runs-on: ubuntu-24.04
    # A failed selection step deploys every component instead of skipping one.
    outputs:
      deploy_platform: ${{ steps.select.outcome == 'success' && steps.select.outputs.deploy_platform || 'true' }}
      deploy_web: ${{ steps.select.outcome == 'success' && steps.select.outputs.deploy_web || 'true' }}
      deploy_admin: ${{ steps.select.outcome == 'success' && steps.select.outputs.deploy_admin || 'true' }}
      deploy_any: ${{ steps.select.outcome == 'success' && steps.select.outputs.deploy_any || 'true' }}
      auth_changed: ${{ steps.select.outcome == 'success' && steps.select.outputs.auth_changed || 'true' }}
      backend_changed: ${{ steps.select.outcome == 'success' && steps.select.outputs.backend_changed || 'true' }}
      infra_changed: ${{ steps.select.outcome == 'success' && steps.select.outputs.infra_changed || 'true' }}
      # The values read at selection time; the record job writes a new SHA only
      # while SSM still holds them.
      platform_read_sha: ${{ steps.deployed.outputs.platform_sha || 'unreadable' }}
      web_read_sha: ${{ steps.deployed.outputs.web_sha || 'unreadable' }}
      admin_read_sha: ${{ steps.deployed.outputs.admin_sha || 'unreadable' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        id: aws_credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Each value is the component's last successfully released SHA, "missing"
      # when the parameter does not exist yet, or "unreadable" when SSM could not
      # be read. The selection step deploys the component for both sentinels.
      - name: Read deployed component SHAs
        id: deployed
        continue-on-error: true
        env:
          AWS_CREDENTIALS_OUTCOME: ${{ steps.aws_credentials.outcome }}
        run: |
          set -euo pipefail

          parameter_prefix="/${STACK_NAME}/release/deployed-sha"
          platform_sha="unreadable"
          web_sha="unreadable"
          admin_sha="unreadable"

          if [[ "${AWS_CREDENTIALS_OUTCOME}" != "success" ]]; then
            echo "::warning::AWS credentials are unavailable, so every component deploys."
          elif ! response="$(aws ssm get-parameters \
            --names "${parameter_prefix}/platform" "${parameter_prefix}/web" "${parameter_prefix}/admin" \
            --output json)"; then
            echo "::warning::Reading ${parameter_prefix}/* from SSM failed, so every component deploys."
          else
            # Errexit does not reach inside $(...), so every failure returns
            # explicitly and the caller maps it to "unreadable", never to
            # "missing".
            read_parameter() {
              local name="$1"
              local value
              if ! value="$(jq -r --arg name "${name}" '.Parameters[] | select(.Name == $name) | .Value' <<< "${response}")"; then
                return 1
              fi
              if [[ -z "${value}" ]]; then
                value="missing"
              fi
              printf '%s' "${value}"
            }
            if ! platform_sha="$(read_parameter "${parameter_prefix}/platform")"; then
              platform_sha="unreadable"
            fi
            if ! web_sha="$(read_parameter "${parameter_prefix}/web")"; then
              web_sha="unreadable"
            fi
            if ! admin_sha="$(read_parameter "${parameter_prefix}/admin")"; then
              admin_sha="unreadable"
            fi
            if [[ "${platform_sha}" == "unreadable" || "${web_sha}" == "unreadable" || "${admin_sha}" == "unreadable" ]]; then
              echo "::warning::Parsing the SSM response failed, so every unreadable component deploys."
            fi
          fi

          {
            echo "platform_sha=${platform_sha}"
            echo "web_sha=${web_sha}"
            echo "admin_sha=${admin_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Select components to deploy
        id: select
        continue-on-error: true
        env:
          PLATFORM_DEPLOYED_SHA: ${{ steps.deployed.outputs.platform_sha || 'unreadable' }}
          WEB_DEPLOYED_SHA: ${{ steps.deployed.outputs.web_sha || 'unreadable' }}
          ADMIN_DEPLOYED_SHA: ${{ steps.deployed.outputs.admin_sha || 'unreadable' }}
        run: |
          bash scripts/deploy/select-release-components.sh \
            --event-name "${GITHUB_EVENT_NAME}" \
            --target-sha "${GITHUB_SHA}" \
            --platform-deployed-sha "${PLATFORM_DEPLOYED_SHA}" \
            --web-deployed-sha "${WEB_DEPLOYED_SHA}" \
            --admin-deployed-sha "${ADMIN_DEPLOYED_SHA}"

      - name: Summarize selection fallback
        if: ${{ steps.select.outcome != 'success' }}
        run: |
          {
            echo "## Release components"
            echo ""
            echo "Component selection failed, so every component deploys (full deploy). See the \`Select components to deploy\` step log."
          } >> "${GITHUB_STEP_SUMMARY}"

  pre_deploy_checks:
    name: Pre-deploy checks
    needs: changes
    if: ${{ needs.changes.outputs.deploy_any == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres-integration-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_USER: postgres_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres_integration -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/auth/package-lock.json
            apps/backend/package-lock.json
            apps/web/package-lock.json
            apps/admin/package-lock.json
            infra/aws/package-lock.json

      - name: Install platform dependencies
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        run: |
          npm ci --prefix apps/auth
          npm ci --prefix apps/backend
          npm ci --prefix infra/aws

      - name: Install web dependencies
        if: ${{ needs.changes.outputs.deploy_web == 'true' }}
        run: npm ci --prefix apps/web

      - name: Install admin dependencies
        if: ${{ needs.changes.outputs.deploy_admin == 'true' }}
        run: npm ci --prefix apps/admin

      - name: Build auth app
        if: ${{ needs.changes.outputs.auth_changed == 'true' }}
        run: npm run build --prefix apps/auth

      - name: Test auth app
        if: ${{ needs.changes.outputs.auth_changed == 'true' }}
        run: npm run test --prefix apps/auth

      - name: Lint backend
        if: ${{ needs.changes.outputs.backend_changed == 'true' }}
        run: npm run lint --prefix apps/backend

      - name: Build backend
        if: ${{ needs.changes.outputs.backend_changed == 'true' }}
        run: npm run build --prefix apps/backend

      - name: Test backend MCP protocol
        if: ${{ needs.changes.outputs.backend_changed == 'true' }}
        run: npm run test:mcp --prefix apps/backend

      - name: Test PostgreSQL 18 lifecycle and 0096 to 0097 security boundaries
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        env:
          POSTGRES_INTEGRATION_ADMIN_URL: postgresql://postgres_integration:postgres-integration-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/postgres?sslmode=disable
        run: npm run test:postgres-integration --prefix apps/backend

      - name: Build web app
        if: ${{ needs.changes.outputs.deploy_web == 'true' }}
        run: npm run build --prefix apps/web

      - name: Build admin app
        if: ${{ needs.changes.outputs.deploy_admin == 'true' }}
        run: npm run build --prefix apps/admin

      - name: Build infra
        if: ${{ needs.changes.outputs.infra_changed == 'true' }}
        run: npm run build --prefix infra/aws

      - name: Test infra
        if: ${{ needs.changes.outputs.infra_changed == 'true' }}
        run: npm run test --prefix infra/aws

      - name: Set up Docker QEMU for CDK bundling
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Synthesize infra
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        working-directory: infra/aws
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          CDK_CONTEXT_ALERT_EMAIL: ${{ vars.CDK_ALERT_EMAIL }}
          CDK_CONTEXT_ANALYTICS_ACCESS_ENABLED: ${{ vars.CDK_ANALYTICS_ACCESS_ENABLED }}
          CDK_CONTEXT_ANTHROPIC_API_KEY_SECRET_ARN: ${{ vars.CDK_ANTHROPIC_API_KEY_SECRET_ARN }}
          CDK_CONTEXT_API_CERTIFICATE_ARN: ${{ vars.CDK_API_CERTIFICATE_ARN }}
          CDK_CONTEXT_APEX_REDIRECT_CERTIFICATE_ARN_US_EAST_1: ${{ vars.CDK_APEX_REDIRECT_CERTIFICATE_ARN_US_EAST_1 }}
          CDK_CONTEXT_AUTH_CERTIFICATE_ARN: ${{ vars.CDK_AUTH_CERTIFICATE_ARN }}
          CDK_CONTEXT_API_ALTERNATE_DOMAIN_NAME: ${{ vars.CDK_API_ALTERNATE_DOMAIN_NAME }}
          CDK_CONTEXT_API_ALTERNATE_CERTIFICATE_ARN: ${{ vars.CDK_API_ALTERNATE_CERTIFICATE_ARN }}
          CDK_CONTEXT_AUTH_ALTERNATE_DOMAIN_NAME: ${{ vars.CDK_AUTH_ALTERNATE_DOMAIN_NAME }}
          CDK_CONTEXT_AUTH_ALTERNATE_CERTIFICATE_ARN: ${{ vars.CDK_AUTH_ALTERNATE_CERTIFICATE_ARN }}
          CDK_CONTEXT_API_ALTERNATE_HOST_LIVE: ${{ vars.CDK_API_ALTERNATE_HOST_LIVE }}
          CDK_CONTEXT_AUTH_ALTERNATE_HOST_LIVE: ${{ vars.CDK_AUTH_ALTERNATE_HOST_LIVE }}
          CDK_CONTEXT_COOKIE_DOMAIN: ${{ vars.CDK_COOKIE_DOMAIN }}
          CDK_CONTEXT_MCP_CERTIFICATE_ARN: ${{ vars.CDK_MCP_CERTIFICATE_ARN }}
          CDK_CONTEXT_MCP_ALTERNATE_DOMAIN_NAME: ${{ vars.CDK_MCP_ALTERNATE_DOMAIN_NAME }}
          CDK_CONTEXT_MCP_ALTERNATE_CERTIFICATE_ARN: ${{ vars.CDK_MCP_ALTERNATE_CERTIFICATE_ARN }}
          CDK_CONTEXT_MCP_ALTERNATE_HOST_LIVE: ${{ vars.CDK_MCP_ALTERNATE_HOST_LIVE }}
          CDK_CONTEXT_ADMIN_CERTIFICATE_ARN_US_EAST_1: ${{ vars.CDK_ADMIN_CERTIFICATE_ARN_US_EAST_1 }}
          CDK_CONTEXT_ADMIN_ADDITIONAL_DOMAIN_NAME: ${{ vars.CDK_ADMIN_ADDITIONAL_DOMAIN_NAME }}
          CDK_CONTEXT_ADMIN_ADDITIONAL_CERTIFICATE_ARN_US_EAST_1: ${{ vars.CDK_ADMIN_ADDITIONAL_CERTIFICATE_ARN_US_EAST_1 }}
          CDK_CONTEXT_ADMIN_EMAILS: ${{ vars.CDK_ADMIN_EMAILS }}
          CDK_CONTEXT_DEMO_EMAIL_DOSTIP: ${{ vars.CDK_DEMO_EMAIL_DOSTIP }}
          CDK_CONTEXT_DEMO_PASSWORD_SECRET_ARN: ${{ vars.CDK_DEMO_PASSWORD_SECRET_ARN }}
          CDK_CONTEXT_DOMAIN_NAME: ${{ vars.CDK_DOMAIN_NAME }}
          CDK_CONTEXT_GITHUB_REPO: ${{ vars.CDK_GITHUB_REPO }}
          CDK_CONTEXT_GLOBAL_METRICS_VISIBLE: ${{ vars.CDK_GLOBAL_METRICS_VISIBLE }}
          CDK_CONTEXT_LANGFUSE_BASE_URL: ${{ vars.CDK_LANGFUSE_BASE_URL }}
          CDK_CONTEXT_LANGFUSE_PUBLIC_KEY_SECRET_ARN: ${{ vars.CDK_LANGFUSE_PUBLIC_KEY_SECRET_ARN }}
          CDK_CONTEXT_LANGFUSE_SECRET_KEY_SECRET_ARN: ${{ vars.CDK_LANGFUSE_SECRET_KEY_SECRET_ARN }}
          CDK_CONTEXT_OPENAI_API_KEY_SECRET_ARN: ${{ vars.CDK_OPENAI_API_KEY_SECRET_ARN }}
          CDK_CONTEXT_REGION: ${{ vars.AWS_REGION }}
          CDK_CONTEXT_RESEND_API_KEY_SECRET_ARN: ${{ vars.CDK_RESEND_API_KEY_SECRET_ARN }}
          CDK_CONTEXT_RESEND_SENDER_EMAIL: ${{ vars.CDK_RESEND_SENDER_EMAIL }}
          CDK_CONTEXT_SENTRY_DSN_SECRET_ARN: ${{ vars.CDK_SENTRY_DSN_SECRET_ARN }}
          CDK_CONTEXT_SENTRY_ENVIRONMENT: ${{ vars.CDK_SENTRY_ENVIRONMENT }}
          CDK_CONTEXT_SENTRY_RELEASE: ${{ github.sha }}
          CDK_CONTEXT_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.CDK_SENTRY_TRACES_SAMPLE_RATE }}
          CDK_CONTEXT_SITE_BASE_URL: ${{ vars.CDK_SITE_BASE_URL }}
          CDK_CONTEXT_API_BASE_URL: ${{ vars.CDK_API_BASE_URL }}
          CDK_CONTEXT_WEB_CERTIFICATE_ARN_US_EAST_1: ${{ vars.CDK_WEB_CERTIFICATE_ARN_US_EAST_1 }}
          CDK_CONTEXT_WEB_ADDITIONAL_DOMAIN_NAME: ${{ vars.CDK_WEB_ADDITIONAL_DOMAIN_NAME }}
          CDK_CONTEXT_WEB_ADDITIONAL_CERTIFICATE_ARN_US_EAST_1: ${{ vars.CDK_WEB_ADDITIONAL_CERTIFICATE_ARN_US_EAST_1 }}
          CDK_CONTEXT_WEB_PRIMARY_HOST_RETIRED: ${{ vars.CDK_WEB_PRIMARY_HOST_RETIRED }}
        run: |
          python3 ../../scripts/generate/write-ci-cdk-context.py \
            --output cdk.context.local.json \
            --aws-deploy-role-arn "${AWS_DEPLOY_ROLE_ARN}"
          npm run synth
          python3 ../../scripts/deploy/report-cloudformation-budget.py cdk.out

  aws_deploy:
    name: Deploy AWS release
    needs:
      - changes
      - pre_deploy_checks
    if: ${{ needs.changes.outputs.deploy_any == 'true' && needs.pre_deploy_checks.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/auth/package-lock.json
            apps/backend/package-lock.json
            apps/web/package-lock.json
            apps/admin/package-lock.json
            infra/aws/package-lock.json

      - name: Install platform dependencies
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        run: |
          npm ci --prefix apps/auth
          npm ci --prefix apps/backend
          npm ci --prefix infra/aws

      - name: Install web dependencies
        if: ${{ needs.changes.outputs.deploy_web == 'true' }}
        run: npm ci --prefix apps/web

      - name: Install admin dependencies
        if: ${{ needs.changes.outputs.deploy_admin == 'true' }}
        run: npm ci --prefix apps/admin

      - name: Build web app
        if: ${{ needs.changes.outputs.deploy_web == 'true' }}
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}
          VITE_APP_BUILD: ${{ github.sha }}
          SENTRY_UPLOAD_SOURCEMAPS: ${{ vars.VITE_SENTRY_DSN != '' && 'true' || 'false' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_WEB_PROJECT }}
        run: npm run build --prefix apps/web

      - name: Build admin app
        if: ${{ needs.changes.outputs.deploy_admin == 'true' }}
        run: npm run build --prefix apps/admin

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pin native refactor AWS CLI
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://awscli.amazonaws.com/awscli-exe-linux-aarch64-2.36.24.zip \
            --output "${RUNNER_TEMP}/monitoring-awscli.zip"
          unzip -q "${RUNNER_TEMP}/monitoring-awscli.zip" -d "${RUNNER_TEMP}/monitoring-awscli"
          "${RUNNER_TEMP}/monitoring-awscli/aws/install" \
            --install-dir "${RUNNER_TEMP}/monitoring-aws" --bin-dir "${RUNNER_TEMP}/monitoring-bin"
          echo "${RUNNER_TEMP}/monitoring-bin" >> "${GITHUB_PATH}"

      - name: Recover the exact unchanged alarm rollback failures
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        run: |
          python3 scripts/deploy/migrate-monitoring-stack.py recover-unchanged-alarms \
            --directory "${RUNNER_TEMP}/monitoring-alarm-recovery"

      - name: Restore the reviewed original core stack control
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        run: |
          python3 scripts/deploy/migrate-monitoring-stack.py recover-core \
            --directory "${RUNNER_TEMP}/monitoring-core-recovery"

      - name: Resume the reviewed monitoring refactor before deployment
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        run: |
          python3 scripts/deploy/migrate-monitoring-stack.py resume-reviewed \
            --directory "${RUNNER_TEMP}/monitoring-reviewed-resume"

      - name: Resolve authoritative monitoring ownership before deployment
        id: monitoring_ownership
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        run: |
          python3 scripts/deploy/migrate-monitoring-stack.py ownership \
            --directory "${RUNNER_TEMP}/monitoring-refactor"

      - name: Prohibit schema changes in the ownership migration release
        if: ${{ steps.monitoring_ownership.outputs.state == 'legacy' }}
        env:
          PLATFORM_SHA: ${{ needs.changes.outputs.platform_read_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${PLATFORM_SHA}^{commit}"
          if [[ -n "$(git diff --name-only "${PLATFORM_SHA}" "${GITHUB_SHA}" -- db/migrations)" ]]; then
            echo "::error::Publish schema changes separately before the monitoring ownership migration."
            exit 1
          fi

      - name: CDK deploy with migration-gated runtime and reconciliation schedule disabled
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        working-directory: infra/aws
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          CDK_CONTEXT_ALERT_EMAIL: ${{ vars.CDK_ALERT_EMAIL }}
          CDK_CONTEXT_ANALYTICS_ACCESS_ENABLED: ${{ vars.CDK_ANALYTICS_ACCESS_ENABLED }}
          CDK_CONTEXT_ANTHROPIC_API_KEY_SECRET_ARN: ${{ vars.CDK_ANTHROPIC_API_KEY_SECRET_ARN }}
          CDK_CONTEXT_API_CERTIFICATE_ARN: ${{ vars.CDK_API_CERTIFICATE_ARN }}
          CDK_CONTEXT_APEX_REDIRECT_CERTIFICATE_ARN_US_EAST_1: ${{ vars.CDK_APEX_REDIRECT_CERTIFICATE_ARN_US_EAST_1 }}
          CDK_CONTEXT_AUTH_CERTIFICATE_ARN: ${{ vars.CDK_AUTH_CERTIFICATE_ARN }}
          CDK_CONTEXT_API_ALTERNATE_DOMAIN_NAME: ${{ vars.CDK_API_ALTERNATE_DOMAIN_NAME }}
          CDK_CONTEXT_API_ALTERNATE_CERTIFICATE_ARN: ${{ vars.CDK_API_ALTERNATE_CERTIFICATE_ARN }}
          CDK_CONTEXT_AUTH_ALTERNATE_DOMAIN_NAME: ${{ vars.CDK_AUTH_ALTERNATE_DOMAIN_NAME }}
          CDK_CONTEXT_AUTH_ALTERNATE_CERTIFICATE_ARN: ${{ vars.CDK_AUTH_ALTERNATE_CERTIFICATE_ARN }}
          CDK_CONTEXT_API_ALTERNATE_HOST_LIVE: ${{ vars.CDK_API_ALTERNATE_HOST_LIVE }}
          CDK_CONTEXT_AUTH_ALTERNATE_HOST_LIVE: ${{ vars.CDK_AUTH_ALTERNATE_HOST_LIVE }}
          CDK_CONTEXT_COOKIE_DOMAIN: ${{ vars.CDK_COOKIE_DOMAIN }}
          CDK_CONTEXT_MCP_CERTIFICATE_ARN: ${{ vars.CDK_MCP_CERTIFICATE_ARN }}
          CDK_CONTEXT_MCP_ALTERNATE_DOMAIN_NAME: ${{ vars.CDK_MCP_ALTERNATE_DOMAIN_NAME }}
          CDK_CONTEXT_MCP_ALTERNATE_CERTIFICATE_ARN: ${{ vars.CDK_MCP_ALTERNATE_CERTIFICATE_ARN }}
          CDK_CONTEXT_MCP_ALTERNATE_HOST_LIVE: ${{ vars.CDK_MCP_ALTERNATE_HOST_LIVE }}
          CDK_CONTEXT_ADMIN_CERTIFICATE_ARN_US_EAST_1: ${{ vars.CDK_ADMIN_CERTIFICATE_ARN_US_EAST_1 }}
          CDK_CONTEXT_ADMIN_ADDITIONAL_DOMAIN_NAME: ${{ vars.CDK_ADMIN_ADDITIONAL_DOMAIN_NAME }}
          CDK_CONTEXT_ADMIN_ADDITIONAL_CERTIFICATE_ARN_US_EAST_1: ${{ vars.CDK_ADMIN_ADDITIONAL_CERTIFICATE_ARN_US_EAST_1 }}
          CDK_CONTEXT_ADMIN_EMAILS: ${{ vars.CDK_ADMIN_EMAILS }}
          CDK_CONTEXT_DEMO_EMAIL_DOSTIP: ${{ vars.CDK_DEMO_EMAIL_DOSTIP }}
          CDK_CONTEXT_DEMO_PASSWORD_SECRET_ARN: ${{ vars.CDK_DEMO_PASSWORD_SECRET_ARN }}
          CDK_CONTEXT_DOMAIN_NAME: ${{ vars.CDK_DOMAIN_NAME }}
          CDK_CONTEXT_GITHUB_REPO: ${{ vars.CDK_GITHUB_REPO }}
          CDK_CONTEXT_GLOBAL_METRICS_VISIBLE: ${{ vars.CDK_GLOBAL_METRICS_VISIBLE }}
          CDK_CONTEXT_LANGFUSE_BASE_URL: ${{ vars.CDK_LANGFUSE_BASE_URL }}
          CDK_CONTEXT_LANGFUSE_PUBLIC_KEY_SECRET_ARN: ${{ vars.CDK_LANGFUSE_PUBLIC_KEY_SECRET_ARN }}
          CDK_CONTEXT_LANGFUSE_SECRET_KEY_SECRET_ARN: ${{ vars.CDK_LANGFUSE_SECRET_KEY_SECRET_ARN }}
          CDK_CONTEXT_OPENAI_API_KEY_SECRET_ARN: ${{ vars.CDK_OPENAI_API_KEY_SECRET_ARN }}
          CDK_CONTEXT_REGION: ${{ vars.AWS_REGION }}
          CDK_CONTEXT_RESEND_API_KEY_SECRET_ARN: ${{ vars.CDK_RESEND_API_KEY_SECRET_ARN }}
          CDK_CONTEXT_RESEND_SENDER_EMAIL: ${{ vars.CDK_RESEND_SENDER_EMAIL }}
          CDK_CONTEXT_SENTRY_DSN_SECRET_ARN: ${{ vars.CDK_SENTRY_DSN_SECRET_ARN }}
          CDK_CONTEXT_SENTRY_ENVIRONMENT: ${{ vars.CDK_SENTRY_ENVIRONMENT }}
          CDK_CONTEXT_SENTRY_RELEASE: ${{ github.sha }}
          CDK_CONTEXT_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.CDK_SENTRY_TRACES_SAMPLE_RATE }}
          CDK_CONTEXT_SITE_BASE_URL: ${{ vars.CDK_SITE_BASE_URL }}
          CDK_CONTEXT_API_BASE_URL: ${{ vars.CDK_API_BASE_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_BACKEND_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_UPLOAD_BACKEND_SOURCEMAPS: true
          CDK_CONTEXT_WEB_CERTIFICATE_ARN_US_EAST_1: ${{ vars.CDK_WEB_CERTIFICATE_ARN_US_EAST_1 }}
          CDK_CONTEXT_WEB_ADDITIONAL_DOMAIN_NAME: ${{ vars.CDK_WEB_ADDITIONAL_DOMAIN_NAME }}
          CDK_CONTEXT_WEB_ADDITIONAL_CERTIFICATE_ARN_US_EAST_1: ${{ vars.CDK_WEB_ADDITIONAL_CERTIFICATE_ARN_US_EAST_1 }}
          CDK_CONTEXT_WEB_PRIMARY_HOST_RETIRED: ${{ vars.CDK_WEB_PRIMARY_HOST_RETIRED }}
        run: |
          python3 ../../scripts/generate/write-ci-cdk-context.py \
            --output cdk.context.local.json \
            --aws-deploy-role-arn "${AWS_DEPLOY_ROLE_ARN}"
          npx cdk synth --all --quiet \
            -c monitoringTopology=${{ steps.monitoring_ownership.outputs.topology }} \
            -c generatedMediaPromotionScheduleState=DISABLED \
            -c mediaBlobCleanupEnabled=false \
            -c multipartCompletionReconciliationScheduleState=DISABLED
          python3 ../../scripts/deploy/report-cloudformation-budget.py cdk.out
          npx cdk deploy --app cdk.out --all --require-approval never

      - name: Verify required database migration
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        run: |
          bash scripts/deploy/migrate-aws.sh \
            --stack-name ${{ env.STACK_NAME }} \
            --require-latest-migration

      - name: CDK deploy with reconciliation schedule enabled
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        working-directory: infra/aws
        env:
          SENTRY_UPLOAD_BACKEND_SOURCEMAPS: false
        run: |
          npx cdk synth --all --quiet \
            -c monitoringTopology=${{ steps.monitoring_ownership.outputs.topology }} \
            -c generatedMediaPromotionScheduleState=ENABLED \
            -c mediaBlobCleanupEnabled=true \
            -c multipartCompletionReconciliationScheduleState=ENABLED
          python3 ../../scripts/deploy/report-cloudformation-budget.py cdk.out
          npx cdk deploy --app cdk.out --all --require-approval never

      - name: Verify cleanup-capable reconciliation schedules are enabled
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        run: |
          bash scripts/checks/check-multipart-completion-reconciliation-schedule.sh \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Prepare and execute the bounded native monitoring move
        id: monitoring_preview
        if: ${{ steps.monitoring_ownership.outputs.state == 'legacy' }}
        working-directory: infra/aws
        env:
          SENTRY_UPLOAD_BACKEND_SOURCEMAPS: false
        run: |
          set -euo pipefail
          umask 077
          evidence_directory="${RUNNER_TEMP}/monitoring-refactor"
          mkdir "${evidence_directory}"
          for baseline_file in manifest.json FlashcardsOpenSourceApp.template.json FlashcardsOpenSourceApp.assets.json; do
            if [[ ! -s "cdk.out/${baseline_file}" ]]; then
              echo "::error::Missing final legacy assembly file: cdk.out/${baseline_file}"
              exit 1
            fi
          done
          if [[ -e cdk.out/FlashcardsOpenSourceAppMonitoring.template.json ]]; then
            echo "::error::Expected the final legacy assembly; cdk.out contains a monitoring preview."
            exit 1
          fi
          cp -R cdk.out "${evidence_directory}/legacy"
          # Local esbuild source maps depend on the absolute staging directory.
          npx cdk synth --all --quiet --output cdk.out \
            -c monitoringTopology=split \
            -c generatedMediaPromotionScheduleState=ENABLED \
            -c mediaBlobCleanupEnabled=true \
            -c multipartCompletionReconciliationScheduleState=ENABLED
          cp -R cdk.out "${evidence_directory}/split"
          python3 ../../scripts/deploy/prepare-monitoring-refactor.py \
            --legacy-assembly "${evidence_directory}/legacy" \
            --split-assembly "${evidence_directory}/split" \
            --output-directory "${evidence_directory}/report"
          python3 ../../scripts/deploy/migrate-monitoring-stack.py migrate --directory "${evidence_directory}"
          python3 ../../scripts/deploy/report-cloudformation-budget.py cdk.out
          npx cdk deploy --app cdk.out --all --require-approval never

      - name: Save sanitized monitoring preparation evidence
        if: ${{ steps.monitoring_preview.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: monitoring-refactor-mappings-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/monitoring-refactor/report/resource-mappings.json
            ${{ runner.temp }}/monitoring-refactor/report/summary.json

      - name: Report monitoring migration outcome
        if: ${{ always() && needs.changes.outputs.deploy_platform == 'true' }}
        env:
          PREVIEW_OUTCOME: ${{ steps.monitoring_preview.outcome }}
        run: |
          {
            echo "## Monitoring ownership"
            echo "- Initial ownership: ${{ steps.monitoring_ownership.outputs.state }}"
            echo "- Native move and normal split deployment: ${PREVIEW_OUTCOME}"
            echo "- Fresh/split ownership skips the move. Any failed gate blocks this release."
            echo "- Detailed evidence remains in the private bootstrap bucket; public artifacts contain mappings/counts only."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Refresh private GeoLite Country database
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: bash scripts/geolite/refresh-country.sh

      - name: Check demo Cognito users
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        run: bash scripts/checks/check-demo-cognito-users.sh --stack-name ${{ env.STACK_NAME }} --region ${{ env.AWS_REGION }}

      - name: Seed global metrics snapshot
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        run: bash scripts/generate/generate-global-metrics-snapshot.sh --stack-name ${{ env.STACK_NAME }}

      # No schedule rebuilds the dump; only catalog publication events do, so
      # every release reseeds it whatever the components.
      - name: Seed public catalog dump
        run: bash scripts/generate/generate-catalog-dump.sh --stack-name ${{ env.STACK_NAME }}

      - name: Deploy web assets
        if: ${{ needs.changes.outputs.deploy_web == 'true' }}
        run: bash scripts/deploy/deploy-web.sh --stack-name ${{ env.STACK_NAME }}

      - name: Deploy admin assets
        if: ${{ needs.changes.outputs.deploy_admin == 'true' }}
        run: bash scripts/deploy/deploy-admin.sh --stack-name ${{ env.STACK_NAME }}

      - name: Check API health
        if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
        run: bash scripts/checks/check-api-health.sh --stack-name ${{ env.STACK_NAME }}

      # Runs for every component: it is the only probe of the hosted web and
      # admin roots, and it reads the existing stack outputs, so it needs no
      # platform deploy in this run.
      - name: Check public custom domains
        run: bash scripts/checks/check-public-endpoints.sh --stack-name ${{ env.STACK_NAME }}

      - name: Summarize deployed release
        run: |
          {
            echo "## AWS deploy"
            echo ""
            echo "- Deployed SHA: \`${GITHUB_SHA}\`"
            echo "- Platform deployed: \`${{ needs.changes.outputs.deploy_platform }}\`"
            echo "- Web deployed: \`${{ needs.changes.outputs.deploy_web }}\`"
            echo "- Admin deployed: \`${{ needs.changes.outputs.deploy_admin }}\`"
            echo ""
            if [[ "${{ needs.changes.outputs.deploy_admin }}" == "true" ]]; then
              echo "Manual admin smoke remains required for \`https://admin.<domain>\`."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  # Scope note: this job never loads the deployed web assets. It builds `dist`
  # from the merge commit, points `app.nibomo.com` at 127.0.0.1 through
  # `/etc/hosts`, and serves that fresh build over a self-signed certificate.
  # Only `auth.` and `api.` reach real deployed infrastructure, so a green run
  # means the merge commit's web client works against the deployed backend, not
  # that the hosted web deployment is healthy. It also runs when only the
  # platform deployed, to check the web client against the new backend.
  web_smoke:
    name: Web post-deploy smoke
    needs:
      - changes
      - aws_deploy
    if: ${{ needs.changes.outputs.deploy_web == 'true' || needs.changes.outputs.deploy_platform == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5

      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        timeout-minutes: 5
        run: npm ci --prefix apps/web

      - name: Build web app for live smoke
        timeout-minutes: 5
        env:
          VITE_APP_BASE_URL: https://app.nibomo.com
          VITE_API_BASE_URL: https://api.nibomo.com/v1
          VITE_AUTH_BASE_URL: https://auth.nibomo.com
        run: npm run build --prefix apps/web

      - name: Run live web smoke test
        id: live_smoke
        working-directory: apps/web
        shell: bash
        env:
          FLASHCARDS_E2E_APP_BASE_URL: https://app.nibomo.com
          FLASHCARDS_E2E_AUTH_BASE_URL: https://auth.nibomo.com
          FLASHCARDS_LIVE_REVIEW_EMAIL: google-review@example.com
        run: |
          set -euo pipefail

          cert_dir="${RUNNER_TEMP}/web-live-e2e-cert"
          cert_path="${cert_dir}/app.nibomo.com.crt"
          key_path="${cert_dir}/app.nibomo.com.key"
          server_log_path="${RUNNER_TEMP}/web-live-e2e-server.log"

          mkdir -p "${cert_dir}"

          openssl req \
            -x509 \
            -newkey rsa:2048 \
            -sha256 \
            -nodes \
            -days 1 \
            -subj "/CN=app.nibomo.com" \
            -addext "subjectAltName=DNS:app.nibomo.com" \
            -keyout "${key_path}" \
            -out "${cert_path}"

          printf '127.0.0.1 app.nibomo.com\n' | tee -a /etc/hosts >/dev/null

          env PATH="${PATH}" node scripts/serve-dist-https.mjs \
            --host 0.0.0.0 \
            --port 443 \
            --dir dist \
            --cert "${cert_path}" \
            --key "${key_path}" >"${server_log_path}" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "${server_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl --silent --show-error --fail --insecure https://app.nibomo.com/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --silent --show-error --fail --insecure https://app.nibomo.com/ >/dev/null
          npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-report
          if-no-files-found: ignore
          path: apps/web/playwright-report

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-test-results
          if-no-files-found: ignore
          path: apps/web/test-results

      # The smoke already records console, page-error and network evidence, but it
      # only reaches the run when it is collected into an artifact of its own.
      - name: Collect live smoke failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail

          diagnostics_dir="web-live-smoke-failure-diagnostics"
          server_log_path="${RUNNER_TEMP}/web-live-e2e-server.log"
          mkdir -p "${diagnostics_dir}"

          if [[ -f "${server_log_path}" ]]; then
            cp "${server_log_path}" "${diagnostics_dir}/static-server.log"
            echo "::group::Static web server log"
            cat "${server_log_path}"
            echo "::endgroup::"
          else
            echo "No static web server log at ${server_log_path}."
          fi

          if [[ -d apps/web/test-results ]]; then
            find apps/web/test-results -type f \
              \( -name 'failure-diagnostics.json' -o -name 'failure-summary.txt' \) \
              -exec cp --parents {} "${diagnostics_dir}/" \;
          fi

          find "${diagnostics_dir}" -type f

      - name: Upload live smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-live-smoke-failure-diagnostics
          if-no-files-found: warn
          path: web-live-smoke-failure-diagnostics

      - name: Summarize smoke result
        if: always()
        run: |
          {
            echo "## Web post-deploy smoke"
            echo ""
            echo "- Deployed SHA: \`${GITHUB_SHA}\`"
            echo "- Result: \`${{ steps.live_smoke.outcome }}\`"
            echo "- Artifacts: \`web-playwright-report\`, \`web-playwright-test-results\`, \`web-live-smoke-failure-diagnostics\` (uploaded on failure)"
          } >> "${GITHUB_STEP_SUMMARY}"

  agent_api_smoke:
    name: Agent API post-deploy smoke
    needs:
      - changes
      - aws_deploy
    if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Run agent API smoke test
        id: agent_smoke
        env:
          FLASHCARDS_AGENT_SMOKE_AUTH_BASE_URL: https://auth.flashcards-open-source-app.com
          FLASHCARDS_AGENT_SMOKE_API_BASE_URL: https://api.flashcards-open-source-app.com/v1
          # What the deploy advertises, which the smoke asserts on, as distinct from the
          # host above that it calls: CDK_API_BASE_URL moves only the former. Unset, it
          # is the same primary API base the stack publishes by default.
          FLASHCARDS_AGENT_SMOKE_EXPECTED_ADVERTISED_API_BASE_URL: ${{ vars.CDK_API_BASE_URL != '' && format('{0}/v1', vars.CDK_API_BASE_URL) || 'https://api.flashcards-open-source-app.com/v1' }}
          FLASHCARDS_AGENT_SMOKE_DEMO_EMAIL: google-review@example.com
          FLASHCARDS_AGENT_SMOKE_WORKSPACE_PREFIX: "E2E agent api "
          FLASHCARDS_AGENT_SMOKE_CONNECTION_LABEL_PREFIX: "E2E agent api "
        run: bash scripts/checks/check-agent-api-smoke.sh

      - name: Summarize smoke result
        if: always()
        run: |
          {
            echo "## Agent API post-deploy smoke"
            echo ""
            echo "- Deployed SHA: \`${GITHUB_SHA}\`"
            echo "- Result: \`${{ steps.agent_smoke.outcome }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  mcp_smoke:
    name: MCP post-deploy smoke
    needs:
      - changes
      - aws_deploy
    if: ${{ needs.changes.outputs.deploy_platform == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Run MCP smoke test
        id: mcp_smoke
        env:
          FLASHCARDS_MCP_SMOKE_AUTH_BASE_URL: https://auth.flashcards-open-source-app.com
          FLASHCARDS_MCP_SMOKE_API_BASE_URL: https://api.flashcards-open-source-app.com/v1
          # What the deploy advertises, which the smoke asserts on, as distinct from the
          # host above that it calls: CDK_API_BASE_URL moves only the former. Unset, it
          # is the same primary API base the stack publishes by default.
          FLASHCARDS_MCP_SMOKE_EXPECTED_ADVERTISED_API_BASE_URL: ${{ vars.CDK_API_BASE_URL != '' && format('{0}/v1', vars.CDK_API_BASE_URL) || 'https://api.flashcards-open-source-app.com/v1' }}
          FLASHCARDS_MCP_SMOKE_MCP_BASE_URL: https://mcp.flashcards-open-source-app.com
          FLASHCARDS_MCP_SMOKE_DEMO_EMAIL: google-review@example.com
          FLASHCARDS_MCP_SMOKE_WORKSPACE_PREFIX: "E2E mcp "
          FLASHCARDS_MCP_SMOKE_CONNECTION_LABEL_PREFIX: "E2E mcp "
          # The same three repository variables the deploy jobs pass to CDK, raw: the
          # gate below reads them with the stack's own rule instead of a second,
          # weaker reading. The liveness switch is separate from the two that create
          # the host because the Cloudflare CNAME can only be created from the
          # McpAlternateCustomDomainTarget output of the deploy that creates the
          # custom domain, so that deploy must not already probe the name.
          MCP_ALTERNATE_DOMAIN_NAME: ${{ vars.CDK_MCP_ALTERNATE_DOMAIN_NAME }}
          MCP_ALTERNATE_CERTIFICATE_ARN: ${{ vars.CDK_MCP_ALTERNATE_CERTIFICATE_ARN }}
          MCP_ALTERNATE_HOST_LIVE: ${{ vars.CDK_MCP_ALTERNATE_HOST_LIVE }}
        run: |
          # One rule decides whether the alternate MCP host is policed, and it is the
          # stack's rule, mirrored here: the domain name and the certificate ARN must
          # both carry a value (resolveMcpAlternateHost, which is what creates the
          # host at all) and the liveness switch must read "true" ignoring surrounding
          # whitespace and letter case (isMcpAlternateHostLive), both in
          # infra/aws/lib/mcp-alternate-host.ts. Trimming happens in the shell because
          # a workflow expression has no trim, while scripts/generate/write-ci-cdk-context.py
          # trims every value before CDK reads it. Reading fewer variables here would
          # probe a host the stack deliberately keeps off and turn the release red.
          trim_value() {
            local value="${1}"
            value="${value#"${value%%[![:space:]]*}"}"
            printf '%s' "${value%"${value##*[![:space:]]}"}"
          }

          alternate_domain_name="$(trim_value "${MCP_ALTERNATE_DOMAIN_NAME}")"
          alternate_certificate_arn="$(trim_value "${MCP_ALTERNATE_CERTIFICATE_ARN}")"
          alternate_host_live="$(trim_value "${MCP_ALTERNATE_HOST_LIVE}")"

          export FLASHCARDS_MCP_SMOKE_ALTERNATE_MCP_BASE_URL=""
          if [[ -n "${alternate_domain_name}" \
            && -n "${alternate_certificate_arn}" \
            && "$(printf '%s' "${alternate_host_live}" | tr '[:upper:]' '[:lower:]')" == "true" ]]; then
            export FLASHCARDS_MCP_SMOKE_ALTERNATE_MCP_BASE_URL="https://${alternate_domain_name}"
          fi

          bash scripts/checks/check-mcp-smoke.sh

      - name: Summarize smoke result
        if: always()
        run: |
          {
            echo "## MCP post-deploy smoke"
            echo ""
            echo "- Deployed SHA: \`${GITHUB_SHA}\`"
            echo "- Result: \`${{ steps.mcp_smoke.outcome }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  # A component's SHA advances only after its deploy and its smokes pass. The
  # platform needs the agent API, MCP and web smokes; web needs the web smoke.
  # The main-release concurrency group serializes runs, including reruns, so
  # the next run reads these values only after this job has finished.
  #
  # A selected component that may have changed production without being
  # verified is cleared: its parameter is deleted, so the next run deploys it in
  # full. Keeping the old SHA would be wrong, because reverting the bad commit
  # makes the tree equal that SHA again and the diff would select nothing. This
  # covers a failed smoke and an `aws_deploy` job that failed or was cancelled
  # after its deploy steps may have run. When `changes` fails, `aws_deploy`
  # cannot run and nothing reached production, so this job is skipped.
  #
  # Each write is a compare-and-set against the value the `changes` job read. A
  # rerun of an older run keeps that run's selection, so after a newer run has
  # recorded its SHA the stored value no longer matches; the parameter is then
  # deleted instead of moved back, and the next run deploys that component.
  record_deployed_shas:
    name: Record deployed component SHAs
    needs:
      - changes
      - aws_deploy
      - web_smoke
      - agent_api_smoke
      - mcp_smoke
    if: ${{ always() && needs.changes.result == 'success' && needs.aws_deploy.result != 'skipped' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Record deployed SHAs in SSM
        env:
          DEPLOY_PLATFORM: ${{ needs.changes.outputs.deploy_platform }}
          DEPLOY_WEB: ${{ needs.changes.outputs.deploy_web }}
          DEPLOY_ADMIN: ${{ needs.changes.outputs.deploy_admin }}
          AWS_DEPLOY_RESULT: ${{ needs.aws_deploy.result }}
          WEB_SMOKE_RESULT: ${{ needs.web_smoke.result }}
          AGENT_API_SMOKE_RESULT: ${{ needs.agent_api_smoke.result }}
          MCP_SMOKE_RESULT: ${{ needs.mcp_smoke.result }}
          PLATFORM_READ_SHA: ${{ needs.changes.outputs.platform_read_sha }}
          WEB_READ_SHA: ${{ needs.changes.outputs.web_read_sha }}
          ADMIN_READ_SHA: ${{ needs.changes.outputs.admin_read_sha }}
        run: |
          set -euo pipefail

          parameter_prefix="/${STACK_NAME}/release/deployed-sha"
          summary_rows=""
          write_failed="false"

          # Prints the parameter value, or "missing" when it does not exist.
          # Errexit does not reach inside $(...), so an SSM or jq failure
          # returns nonzero instead of reading as "missing".
          read_current_sha() {
            local name="$1"
            local response
            local value
            if ! response="$(aws ssm get-parameters --names "${name}" --output json)"; then
              return 1
            fi
            if ! value="$(jq -r --arg name "${name}" '.Parameters[] | select(.Name == $name) | .Value' <<< "${response}")"; then
              return 1
            fi
            if [[ -z "${value}" ]]; then
              value="missing"
            fi
            printf '%s' "${value}"
          }

          # Deletes the parameter so the next run deploys the component in
          # full. An already absent parameter counts as cleared.
          clear_component() {
            local component="$1"
            local name="$2"
            local reason="$3"
            local output
            if output="$(aws ssm delete-parameter --name "${name}" 2>&1)" \
              || [[ "${output}" == *ParameterNotFound* ]]; then
              summary_rows="${summary_rows}| ${component} | cleared: ${reason}; the next run deploys it |"$'\n'
            else
              echo "::error::Clearing ${name} failed, so it may still name a SHA production no longer runs: ${output}"
              summary_rows="${summary_rows}| ${component} | clear failed: ${reason} |"$'\n'
              write_failed="true"
            fi
          }

          # Empty when the deployed component was verified, otherwise why not.
          verification_failure() {
            local component="$1"
            if [[ "${AWS_DEPLOY_RESULT}" != "success" ]]; then
              echo "deploy job ended \`${AWS_DEPLOY_RESULT}\`, so production may run an unverified build"
              return
            fi
            case "${component}" in
              platform)
                if [[ "${WEB_SMOKE_RESULT}" != "success" ]]; then
                  echo "web smoke did not pass (\`${WEB_SMOKE_RESULT}\`), which blocks the platform"
                elif [[ "${AGENT_API_SMOKE_RESULT}" != "success" ]]; then
                  echo "agent API smoke did not pass (\`${AGENT_API_SMOKE_RESULT}\`)"
                elif [[ "${MCP_SMOKE_RESULT}" != "success" ]]; then
                  echo "MCP smoke did not pass (\`${MCP_SMOKE_RESULT}\`)"
                fi
                ;;
              web)
                if [[ "${WEB_SMOKE_RESULT}" != "success" ]]; then
                  echo "web smoke did not pass (\`${WEB_SMOKE_RESULT}\`)"
                fi
                ;;
            esac
          }

          for component in platform web admin; do
            case "${component}" in
              platform) selected="${DEPLOY_PLATFORM}"; read_sha="${PLATFORM_READ_SHA}" ;;
              web) selected="${DEPLOY_WEB}"; read_sha="${WEB_READ_SHA}" ;;
              admin) selected="${DEPLOY_ADMIN}"; read_sha="${ADMIN_READ_SHA}" ;;
            esac
            parameter_name="${parameter_prefix}/${component}"

            if [[ "${selected}" != "true" ]]; then
              summary_rows="${summary_rows}| ${component} | unchanged: not deployed in this run |"$'\n'
              continue
            fi

            reason="$(verification_failure "${component}")"
            if [[ -n "${reason}" ]]; then
              echo "::warning::Clearing ${parameter_name}: ${reason}."
              clear_component "${component}" "${parameter_name}" "${reason}"
              continue
            fi

            # An unknown current value cannot pass compare-and-set, and a
            # write could move a newer SHA back. Clearing is always safe: the
            # worst case is one extra full deploy of this component.
            if ! current_sha="$(read_current_sha "${parameter_name}")"; then
              echo "::warning::Reading ${parameter_name} failed, so the compare-and-set cannot run and the parameter is cleared."
              clear_component "${component}" "${parameter_name}" "reading the stored SHA failed"
              continue
            fi

            # "unreadable" at selection time only proves the parameter was
            # absent when it is still absent now.
            if [[ "${current_sha}" == "${GITHUB_SHA}" \
              || "${current_sha}" == "${read_sha}" \
              || ( "${current_sha}" == "missing" && "${read_sha}" == "unreadable" ) ]]; then
              if aws ssm put-parameter \
                --name "${parameter_name}" \
                --type String \
                --value "${GITHUB_SHA}" \
                --overwrite >/dev/null; then
                summary_rows="${summary_rows}| ${component} | recorded \`${GITHUB_SHA}\` |"$'\n'
              else
                echo "::error::Writing ${parameter_name} failed."
                summary_rows="${summary_rows}| ${component} | record failed; still \`${current_sha}\` |"$'\n'
                write_failed="true"
              fi
            else
              echo "::warning::${parameter_name} changed from \`${read_sha}\` to \`${current_sha}\` since this run selected components, so it is cleared."
              clear_component "${component}" "${parameter_name}" "changed from \`${read_sha}\` to \`${current_sha}\` since selection"
            fi
          done

          {
            echo "## Recorded deployed SHAs"
            echo ""
            echo "| Component | \`${parameter_prefix}/<component>\` |"
            echo "| --- | --- |"
            printf '%s' "${summary_rows}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${write_failed}" == "true" ]]; then
            exit 1
          fi

  aws_release_status:
    name: Resolve AWS release outcome
    needs:
      - changes
      - pre_deploy_checks
      - aws_deploy
      - web_smoke
      - agent_api_smoke
      - mcp_smoke
      - record_deployed_shas
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    outputs:
      aws_release_status: ${{ steps.resolve.outputs.aws_release_status }}

    steps:
      # A smoke skipped because its component was not selected is not a failure.
      - name: Resolve AWS release status
        id: resolve
        run: |
          set -euo pipefail

          deploy_platform="${{ needs.changes.outputs.deploy_platform }}"
          deploy_web="${{ needs.changes.outputs.deploy_web }}"
          aws_release_status="no_aws_changes"

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            aws_release_status="component_selection_failed"
          elif [[ "${{ needs.changes.outputs.deploy_any }}" == "true" ]]; then
            if [[ "${{ needs.pre_deploy_checks.result }}" != "success" ]]; then
              aws_release_status="pre_deploy_checks_failed"
            elif [[ "${{ needs.aws_deploy.result }}" != "success" ]]; then
              aws_release_status="deployment_failed"
            elif [[ ( "${deploy_web}" == "true" || "${deploy_platform}" == "true" ) && "${{ needs.web_smoke.result }}" != "success" ]]; then
              aws_release_status="web_smoke_failed"
            elif [[ "${deploy_platform}" == "true" && "${{ needs.agent_api_smoke.result }}" != "success" ]]; then
              aws_release_status="agent_api_smoke_failed"
            elif [[ "${deploy_platform}" == "true" && "${{ needs.mcp_smoke.result }}" != "success" ]]; then
              aws_release_status="mcp_smoke_failed"
            elif [[ "${{ needs.record_deployed_shas.result }}" != "success" ]]; then
              aws_release_status="deployed_sha_record_failed"
            else
              aws_release_status="released"
            fi
          fi

          echo "aws_release_status=${aws_release_status}" >> "${GITHUB_OUTPUT}"

      - name: Summarize AWS release outcome
        run: |
          {
            echo "## AWS release outcome"
            echo ""
            echo "- AWS release status: \`${{ steps.resolve.outputs.aws_release_status }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  release_summary:
    name: AWS/Web release summary
    if: ${{ always() }}
    needs:
      - changes
      - pre_deploy_checks
      - aws_deploy
      - web_smoke
      - agent_api_smoke
      - mcp_smoke
      - record_deployed_shas
      - aws_release_status
    runs-on: ubuntu-24.04

    steps:
      - name: Summarize release outcome
        run: |
          {
            echo "## AWS/Web release summary"
            echo ""
            echo "- Platform selected: \`${{ needs.changes.outputs.deploy_platform }}\`"
            echo "- Web selected: \`${{ needs.changes.outputs.deploy_web }}\`"
            echo "- Admin selected: \`${{ needs.changes.outputs.deploy_admin }}\`"
            echo "- Pre-deploy checks job: \`${{ needs.pre_deploy_checks.result }}\`"
            echo "- AWS release status: \`${{ needs.aws_release_status.outputs.aws_release_status }}\`"
            echo "- AWS deploy job: \`${{ needs.aws_deploy.result }}\`"
            echo "- Web smoke job: \`${{ needs.web_smoke.result }}\`"
            echo "- Agent API smoke job: \`${{ needs.agent_api_smoke.result }}\`"
            echo "- MCP smoke job: \`${{ needs.mcp_smoke.result }}\`"
            echo "- Record deployed SHAs job: \`${{ needs.record_deployed_shas.result }}\`"
            echo "- Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail workflow when AWS/Web release is not healthy
        run: |
          set -euo pipefail

          aws_release_status="${{ needs.aws_release_status.outputs.aws_release_status }}"

          if [[ "${aws_release_status}" != "no_aws_changes" ]] && [[ "${aws_release_status}" != "released" ]]; then
            echo "AWS release finished in non-healthy state: ${aws_release_status}" >&2
            exit 1
          fi
