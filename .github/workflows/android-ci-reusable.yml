name: Android CI reusable

on:
  workflow_call:
    inputs:
      target_ref:
        required: true
        type: string
      android_version_code:
        required: true
        type: string
      run_data_local_instrumentation:
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Android build, unit tests, and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Install Android SDK packages
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Run Android unit tests, build debug artifacts, and lint
        env:
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
        run: bash scripts/android/run-android-ci.sh

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apks
          if-no-files-found: error
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Upload lint report
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          if-no-files-found: error
          path: apps/android/app/build/reports/lint-results-debug.html

      - name: Upload unit test reports
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          if-no-files-found: error
          path: |
            apps/android/**/build/reports/tests/**
            apps/android/**/build/test-results/**

  emulator-data-local-instrumentation:
    name: Android emulator data:local instrumentation
    needs:
      - build
    if: ${{ inputs.run_data_local_instrumentation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Install Android SDK Command-line Tools 22.0
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cmdline_tools_root="${ANDROID_SDK_ROOT}/cmdline-tools"
          runner_image_tools="${cmdline_tools_root}/latest"
          runner_image_backup="${cmdline_tools_root}/latest-runner-image-12.0"
          installed_tools="${cmdline_tools_root}/22.0"

          "${runner_image_tools}/bin/sdkmanager" "cmdline-tools;22.0"

          if [[ ! -x "${installed_tools}/bin/sdkmanager" || ! -x "${installed_tools}/bin/avdmanager" ]]; then
            echo "::error::Command-line Tools 22.0 did not install correctly at ${installed_tools}."
            exit 1
          fi
          if [[ -e "${runner_image_backup}" || -L "${runner_image_backup}" ]]; then
            echo "::error::Cannot preserve the runner's Command-line Tools because ${runner_image_backup} already exists."
            exit 1
          fi

          mv "${runner_image_tools}" "${runner_image_backup}"
          ln -s "22.0" "${runner_image_tools}"
          echo "${installed_tools}/bin" >> "${GITHUB_PATH}"

      - name: Install Android SDK packages
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "system-images;android-37.0;google_apis;x86_64"

      - name: Create and validate Android 17 AVD
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail

          export ANDROID_AVD_HOME="${HOME}/.android/avd"
          avdmanager_path="${ANDROID_SDK_ROOT}/cmdline-tools/22.0/bin/avdmanager"
          avd_root_ini="${ANDROID_AVD_HOME}/test.ini"

          mkdir -p "${ANDROID_AVD_HOME}"
          echo no | "${avdmanager_path}" create avd \
            --force \
            --name "test" \
            --package "system-images;android-37.0;google_apis;x86_64" \
            --device "pixel_7_pro"

          if [[ ! -f "${avd_root_ini}" ]]; then
            echo "::error::Expected AVD root INI at ${avd_root_ini}, but the file does not exist."
            exit 1
          fi

          actual_target="$(sed -n '/^target=/p' "${avd_root_ini}")"
          if [[ "${actual_target}" != "target=android-37.0" ]]; then
            echo "::error::Expected ${avd_root_ini} to contain exactly target=android-37.0, found: ${actual_target:-no target entry}."
            exit 1
          fi
          echo "Validated ${avd_root_ini}: ${actual_target}"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run data:local instrumentation suite on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          # Quote the SDK package ID so YAML preserves 37.0 instead of normalizing it to 37.
          api-level: "37.0"
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          avd-name: test
          force-avd-creation: false
          # emulator-runner v2.38.0 writes hw.heapSize, but the emulator reads vm.heapSize.
          pre-emulator-launch-script: adb start-server && echo "vm.heapSize=512" >> "$HOME/.android/avd/test.avd/config.ini"
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: cd apps/android && ANDROID_VERSION_CODE="${{ inputs.android_version_code }}" ./gradlew --no-daemon :data:local:connectedDebugAndroidTest

      - name: Detect data:local instrumentation reports
        if: always()
        id: instrumentation-reports
        run: |
          report_path="$(
            find apps/android/data/local -type f \
              \( -path '*/build/outputs/androidTest-results/*' -o -path '*/build/reports/androidTests/*' \) \
              -print -quit
          )"

          if [[ -n "${report_path}" ]]; then
            echo "reports_found=true" >> "${GITHUB_OUTPUT}"
            echo "Found instrumentation report artifact at ${report_path}."
            exit 0
          fi

          echo "reports_found=false" >> "${GITHUB_OUTPUT}"
          echo "No data:local instrumentation reports were produced."

      - name: Upload data:local instrumentation reports
        if: always() && steps.instrumentation-reports.outputs.reports_found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-data-local-instrumentation-reports
          if-no-files-found: error
          path: |
            apps/android/data/local/**/build/outputs/androidTest-results/**
            apps/android/data/local/**/build/reports/androidTests/**
